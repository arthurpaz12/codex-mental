<!doctype html>
<html lang="pt-BR">
<head>

<title>Brazil Noir · Painel do canal</title>
<meta name="description" content="Alcance, gastos e progresso rumo à monetização do canal Brazil Noir no YouTube, TikTok e Reels.">
<meta name="theme-color" content="#0f0f10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e5484d'/%3E%3C/svg%3E">

<script>
  try { var t = localStorage.getItem("bn-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: #0f0f10;
    --side: #131315;
    --surface: #18181b;
    --surface-2: #1f1f23;
    --surface-3: #27272b;
    --border: #27272a;
    --border-2: #34343a;
    --grid: #26262a;
    --axis: #3a3a40;
    --ink: #f4f4f5;
    --ink-2: #c4c4cc;
    --muted: #8b8b94;
    --accent: #e5484d;
    --accent-ink: #ff6369;
    --accent-soft: rgba(229, 72, 77, 0.12);
    --c-red: #e66767;
    --c-amber: #c98500;
    --c-blue: #3987e5;
    --c-aqua: #199e70;
    --c-magenta: #d55181;
    --c-violet: #9085e9;
    --c-gray: #6f6b66;
    --good: #0ca30c;
    --good-ink: #3dd68c;
    --bad-ink: #ff6369;
    --warn-ink: #f5b544;
    --overlay: rgba(0, 0, 0, 0.72);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f5f5f4; --side: #fafaf9; --surface: #ffffff; --surface-2: #f6f6f5; --surface-3: #ececeb;
      --border: #e7e7e4; --border-2: #d9d9d5; --grid: #ececea; --axis: #c9c9c4;
      --ink: #18181b; --ink-2: #52525b; --muted: #74747c;
      --accent: #d6343a; --accent-ink: #c21d24; --accent-soft: rgba(214, 52, 58, 0.08);
      --c-red: #e34948; --c-amber: #eda100; --c-blue: #2a78d6; --c-aqua: #1baf7a;
      --c-magenta: #e87ba4; --c-violet: #6250d6; --c-gray: #a9a59d;
      --good-ink: #067a3d; --bad-ink: #c21d24; --warn-ink: #8a5a00;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f5f4; --side: #fafaf9; --surface: #ffffff; --surface-2: #f6f6f5; --surface-3: #ececeb;
    --border: #e7e7e4; --border-2: #d9d9d5; --grid: #ececea; --axis: #c9c9c4;
    --ink: #18181b; --ink-2: #52525b; --muted: #74747c;
    --accent: #d6343a; --accent-ink: #c21d24; --accent-soft: rgba(214, 52, 58, 0.08);
    --c-red: #e34948; --c-amber: #eda100; --c-blue: #2a78d6; --c-aqua: #1baf7a;
    --c-magenta: #e87ba4; --c-violet: #6250d6; --c-gray: #a9a59d;
    --good-ink: #067a3d; --bad-ink: #c21d24; --warn-ink: #8a5a00;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  code { font: 12px ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--surface-3); padding: 1px 5px; border-radius: 4px; color: var(--ink-2); }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; }
  .chan { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; border-bottom: 1px solid var(--border); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; overflow: hidden; flex: none; font-weight: 700; font-size: 12px; color: var(--ink); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar .mark { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .chan-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
  .chan-sub { font-size: 12px; color: var(--muted); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 10px 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
  .nav a svg { width: 17px; height: 17px; flex: none; opacity: 0.85; }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a.active { background: var(--accent-soft); color: var(--accent-ink); }
  .nav a.active svg { opacity: 1; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .side-foot .seg { width: 100%; }
  .side-foot .seg button { flex: 1; }
  .side-src { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; }
  .side-src div { display: flex; align-items: center; gap: 8px; }

  .main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .topbar .when { font-size: 12px; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .content { padding: 24px 28px 64px; max-width: 1360px; }

  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
  .icon-btn:hover { color: var(--ink); border-color: var(--border-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--good); }
  .dot.part { background: #f5b544; }
  .dot.off { border: 1.5px solid var(--muted); }

  .notice { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink-2); font-size: 13px; margin-bottom: 20px; }
  .notice .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
  .notice button { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; cursor: pointer; }

  /* ---------- Blocos ---------- */
  .block { margin-top: 36px; }
  .block-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .block-h h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .block-h .sub { font-size: 13px; color: var(--muted); }
  .block-h .right { margin-left: auto; font-size: 12px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-width: 0; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .card-title { font-weight: 600; font-size: 14px; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .link { font-size: 12px; font-weight: 500; color: var(--ink-2); text-decoration: none; }
  .link:hover { color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .empty { display: grid; place-items: center; text-align: center; min-height: 150px; color: var(--muted); font-size: 13px; padding: 18px; border: 1px dashed var(--border-2); border-radius: 10px; margin-top: 10px; line-height: 1.6; }
  .empty b { color: var(--ink-2); font-weight: 600; }

  /* ---------- Destaque + recentes ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .feat { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .feat-media { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .feat-media .thumb { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto; }
  .feat-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.55)); border: 0; cursor: pointer; padding: 0; }
  .play span { width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 15, 16, 0.78); display: grid; place-items: center; transition: transform 0.15s, background 0.15s; }
  .play:hover span { transform: scale(1.06); background: var(--accent); }
  .feat-badge { position: absolute; left: 14px; top: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--overlay); color: #fff; font-size: 12px; font-weight: 600; pointer-events: none; }
  .feat-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
  .feat-top { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
  .feat-title { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
  .feat-title a { text-decoration: none; }
  .feat-title a:hover { text-decoration: underline; }
  .feat-meta { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .feat-hook { font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--border-2); padding-left: 10px; }
  .feat-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .feat-stats > div { padding: 10px 12px; border-right: 1px solid var(--border); min-width: 0; }
  .feat-stats > div:last-child { border-right: 0; }
  .feat-stats span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .feat-stats b { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .feat-cmp { font-size: 13px; color: var(--ink-2); }
  .feat-cmp b { color: var(--good-ink); }
  .feat-tabs { margin-left: auto; }

  .recent { display: flex; flex-direction: column; }
  .rlist { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
  .rlist li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rlist li:last-child { border-bottom: 0; padding-bottom: 0; }
  .rlist .thumb { width: 120px; }
  .r-title { font-size: 13px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r-title a { text-decoration: none; }
  .r-title a:hover { text-decoration: underline; }
  .r-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
  .r-plats { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
  .perf { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .perf.up { color: var(--good-ink); background: color-mix(in srgb, var(--good-ink) 12%, transparent); }
  .perf.down { color: var(--bad-ink); background: color-mix(in srgb, var(--bad-ink) 10%, transparent); }
  .perf.mid { color: var(--muted); background: var(--surface-3); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -4px 0 4px; }
  .tabs button { border: 0; background: none; padding: 8px 10px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs .count { font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); border-radius: 999px; padding: 0 6px; }
  .tabs .spacer { flex: 1; }
  .when-chip { font-size: 12px; font-weight: 600; color: var(--ink); }
  .soon { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }
  .kind { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); }
  .agenda-day { margin-top: 14px; }
  .agenda-day:first-child { margin-top: 4px; }
  .agenda-day h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .agenda-row { display: grid; grid-template-columns: 54px 104px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); }
  .agenda-row .time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .agenda-row .thumb { width: 104px; }
  .agenda-row .t { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
  .agenda-row .m { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; margin-top: 3px; }
  .st { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .st.ok { color: var(--good-ink); background: color-mix(in srgb, var(--good-ink) 12%, transparent); }
  .st.warn { color: var(--warn-ink); background: color-mix(in srgb, var(--warn-ink) 14%, transparent); }
  .st.mid { color: var(--muted); background: var(--surface-3); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 6px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin: 0; cursor: pointer; }
  .checks input { width: auto; accent-color: var(--accent); }
  @media (max-width: 640px) { .agenda-row { grid-template-columns: 48px minmax(0, 1fr) auto; } .agenda-row .thumb { display: none; } }

  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-3); flex: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.ph { background: radial-gradient(120% 90% at 20% 15%, color-mix(in srgb, var(--pc) 45%, #000) 0%, #101012 70%); display: flex; align-items: flex-end; padding: 8px 9px; }
  .thumb.ph .ph-t { color: #fff; font-weight: 700; font-size: 11px; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); max-width: 80%; }
  .feat-media .thumb.ph .ph-t { font-size: clamp(20px, 3vw, 34px); max-width: 70%; padding: 10px; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: var(--overlay); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
  .feat-media .dur { right: 12px; bottom: 12px; font-size: 12px; padding: 2px 7px; }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; line-height: 1.15; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .delta { font-weight: 600; }
  .delta.up { color: var(--good-ink); }
  .delta.down { color: var(--bad-ink); }

  /* ---------- Metas ---------- */
  .goal { display: flex; flex-direction: column; gap: 14px; }
  .goal-top { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
  .goal-name { font-size: 15px; font-weight: 600; }
  .goal-req { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
  .pill.ok { color: var(--good-ink); background: color-mix(in srgb, var(--good-ink) 12%, transparent); }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
  .meter-label { color: var(--ink-2); }
  .meter-val { color: var(--muted); white-space: nowrap; }
  .meter-val b { color: var(--ink); font-weight: 600; }
  .track { height: 6px; border-radius: 999px; background: var(--surface-3); margin-top: 7px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; min-width: 3px; transition: width 0.6s cubic-bezier(.2, .8, .2, 1); }
  .fill.zero { min-width: 0; }
  .meter-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meter-sub .tag { color: var(--ink-2); font-weight: 500; }
  .or { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .goal-foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto; }
  .est { font-size: 11px; color: var(--warn-ink); font-weight: 600; }

  /* ---------- Gráficos ---------- */
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 10px 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
  .chart { position: relative; width: 100%; height: 240px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font: 11px "Inter", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .lbl { fill: var(--ink-2); font-weight: 600; }
  details.data { margin-top: 10px; font-size: 12px; color: var(--muted); }
  details.data summary { cursor: pointer; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 11px; font-size: 12px; box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 0.1s; min-width: 150px; max-width: 280px; }
  .tip.show { opacity: 1; }
  .tip-h { font-weight: 600; margin-bottom: 6px; }
  .tip-row { display: flex; align-items: center; gap: 7px; color: var(--ink-2); line-height: 1.7; }
  .tip-row b { margin-left: auto; padding-left: 12px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip-total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }

  /* ---------- Plataformas ---------- */
  .plat { display: flex; flex-direction: column; gap: 12px; }
  .plat-h { display: flex; align-items: center; gap: 8px; }
  .plat-h .sw { width: 8px; height: 8px; border-radius: 50%; }
  .plat-big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .plat-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  .plat-stats div { font-size: 12px; color: var(--muted); }
  .plat-stats b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; margin-top: 1px; }
  .spark { height: 40px; }

  /* ---------- Destaques ---------- */
  .rank { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }

<script>
(() => {
  "use strict";

  // Chave pública da YouTube Data API (a mesma da v1, restrita por HTTP referrer

  // ---------- Plataformas (cor segue a entidade) ----------
  const PLAT = {
    yt_long:   { label: "YouTube · vídeos", short: "YouTube", net: "youtube",   color: "var(--c-red)" },

  const PLAT_ORDER = ["yt_long", "tiktok", "yt_shorts", "reels"];
  const NETS = {
    youtube:   { label: "YouTube",   unit: "inscritos",  color: "var(--c-red)" },
    tiktok:    { label: "TikTok",    unit: "seguidores", color: "var(--c-blue)" },

  const NET_ORDER = ["youtube", "tiktok", "instagram"];

    impulsionamento: { label: "Impulsionamento", color: "var(--c-magenta)" },
    ferramenta:      { label: "Ferramentas",     color: "var(--c-violet)" },
    outro:           { label: "Outros",          color: "var(--c-gray)" },
  };

  // ---------- Utilitários ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf = new Intl.NumberFormat("pt-BR");
  const isNum = (n) => typeof n === "number" && isFinite(n);
  const fmt = (n) => (isNum(n) ? nf.format(Math.round(n)) : "—");
  const fmt1 = (n) => (isNum(n) ? n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) : "—");
  const fmtC = (n) => {
    if (!isNum(n)) return "—";
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
    if (a >= 1e4) return (n / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
    return nf.format(Math.round(n));
  };
  const brl = (n, d = 2) => (isNum(n) ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: d, maximumFractionDigits: d }) : "—");
  const pct = (n, d = 1) => (isNum(n) ? n.toLocaleString("pt-BR", { maximumFractionDigits: d }) + "%" : "—");
  const dur = (s) => (!isNum(s) ? "—" : s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : `0:${String(Math.round(s)).padStart(2, "0")}`);
  const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
  const median = (arr) => { const a = arr.filter(isNum).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = (k) => { const [y, m, d] = k.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const pubKey = (iso) => (iso && iso.length > 10 ? keyOf(new Date(iso)) : iso);

  const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
  const dShort = (k) => dateOf(k).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(/\./g, "").replace(/ de /g, " ");
  const dLong = (k) => dateOf(k).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" }).replace(/\./g, "").replace(/ de /g, " ");
  const monthYear = (d) => d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }).replace(/\./g, "").replace(/ de /g, " ");
  const ago = (k, refKey) => { const d = daysBetween(k, refKey); return d <= 0 ? "hoje" : d === 1 ? "ontem" : d < 7 ? `há ${d} dias` : d < 60 ? `há ${Math.round(d / 7)} sem` : `há ${Math.round(d / 30)} meses`; };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  // Pasta base: funciona em /brazil-noir, /brazil-noir/ e /brazil-noir/index.html
  const BASE = (() => { const p = location.pathname; if (p.endsWith("/")) return p; if (/\.html?$/.test(p)) return p.slice(0, p.lastIndexOf("/") + 1); return p + "/"; })();
  const getJson = async (file) => { try { const r = await fetch(BASE + file, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch { return null; } };

  // ---------- Estado ----------
  const qs = new URLSearchParams(location.search);
  const state = {
    mode: qs.has("exemplo") ? "sample" : store.get("bn-mode") || "real",
    period: Number(store.get("bn-period") ?? 0),

    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  };

  // ---------- Dados ----------
  async function loadModel(mode) {
    if (mode === "sample") {
      const raw = await getJson("data.sample.json");
      return raw ? buildModel(raw, null, { entries: raw.spend || [] }, { entries: raw.schedule || [] }) : null;
    }
    // Com o servidor local (atalho da área de trabalho) os gastos vêm da API, que dá id a cada linha
    state.api = await fetch("/api/brazil-noir/health", { cache: "no-store" }).then((r) => r.ok && r.headers.get("content-type")?.includes("json")).catch(() => false);
    const coll = (name) => (state.api ? fetch(`/api/brazil-noir/${name}`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null) : getJson(`${name}.json`));
    const [raw, manual, spend, schedule] = await Promise.all([getJson("data.json"), getJson("manual.json"), coll("spend"), coll("schedule")]);
    return buildModel(raw || { mode: "real", videos: [], daily: [], accounts: {}, sources: {} }, manual, spend, schedule);
  }

  // Agenda: o que foi programado à mão + o que o coletor achou agendado no YouTube Studio.
  // Quando sai um vídeo com o mesmo título na mesma rede, o item vira "publicado".
  const normTitle = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/#shorts/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  function buildSchedule(m, scheduleFile, ytScheduled) {
    const items = [];
    for (const e of scheduleFile?.entries || []) {
      if (!e?.at || !e.title) continue;
      items.push({ ...e, platforms: (e.platforms || []).filter((p) => PLAT[p]), when: new Date(e.at), source: "manual" });
    }
    for (const s of ytScheduled || []) {
      if (items.some((i) => i.ytId === s.id)) continue;
      items.push({ id: "yt-" + s.id, ytId: s.id, title: s.title, platforms: [s.platform], kind: s.platform === "yt_long" ? "episodio" : "corte", when: new Date(s.at), thumb: s.thumb, durationSec: s.durationSec, source: "youtube" });
    }
    for (const it of items) {
      const t = normTitle(it.title);
      it.matches = it.platforms.map((p) => m.videos.find((v) => v.platform === p && (normTitle(v.title) === t || (it.ytId && v.id === it.ytId)))).filter(Boolean);
      it.published = it.matches.length > 0;
      const c = m.videos.find((v) => v.case && normTitle(v.title) === t);
      if (!it.case && c) it.case = c.case;
    }
    return items.filter((i) => !isNaN(i.when)).sort((a, b) => a.when - b.when);
  }

  function buildModel(raw, manual, spendFile, scheduleFile) {
    const m = {
      mode: raw.mode || "real",
      generatedAt: raw.generatedAt || null,
      sources: { ...(raw.sources || {}) },
      channel: raw.channel || {},
      accounts: JSON.parse(JSON.stringify(raw.accounts || {})),
      daily: (raw.daily || []).map((r) => ({ ...r })),
      videos: (raw.videos || []).map((v) => ({ ...v })),
      spend: (spendFile?.entries || []).filter((e) => e && e.date && isNum(+e.amount)).map((e) => ({ ...e, amount: +e.amount })),
      manualUsed: {},
    };
    if (manual) {
      for (const s of manual.snapshots || []) {
        if (!s?.date || !NETS[s.platform]) continue;
        const ex = m.daily.find((r) => r.date === s.date && r.platform === s.platform);
        if (ex) { for (const k of ["followers", "totalViews", "views", "likes"]) if (ex[k] == null && s[k] != null) ex[k] = s[k]; }
        else m.daily.push({ date: s.date, platform: s.platform, followers: s.followers ?? null, totalViews: s.totalViews ?? null, views: s.views ?? null, likes: s.likes ?? null, manual: true });
        m.manualUsed[s.platform] = true;
      }
      const byId = new Map(m.videos.map((v) => [v.id, v]));
      for (const v of manual.videos || []) {
        if (!v?.id || !PLAT[v.platform]) continue;
        const clean = Object.fromEntries(Object.entries(v).filter(([, x]) => x != null));
        if (byId.has(v.id)) Object.assign(byId.get(v.id), clean);
        else { const nv = { source: "manual", ...clean }; m.videos.push(nv); byId.set(v.id, nv); }
        m.manualUsed[PLAT[v.platform].net] = true;
      }
      for (const [id, o] of Object.entries(manual.overrides || {})) if (byId.has(id)) Object.assign(byId.get(id), o);
    }
    m.daily.sort((a, b) => (a.date + a.platform).localeCompare(b.date + b.platform));
    for (const net of NET_ORDER) {
      if (isNum(m.accounts[net]?.followers)) continue;
      const rows = m.daily.filter((r) => r.platform === net && isNum(r.followers));
      if (rows.length) { const last = rows.at(-1); m.accounts[net] = { ...(m.accounts[net] || {}), followers: last.followers, views: last.totalViews ?? null, asOf: last.date, manual: true }; }
    }
    finalizeVideos(m);
    m.refDate = m.mode === "sample" && m.generatedAt ? new Date(m.generatedAt) : new Date();
    m.refKey = keyOf(m.refDate);
    m.scheduleFile = scheduleFile;
    m.ytScheduled = raw.scheduled || [];
    m.schedule = buildSchedule(m, scheduleFile, m.ytScheduled);
    return m;
  }

  function finalizeVideos(m) {
    for (const v of m.videos) {
      v.net = PLAT[v.platform]?.net;
      v.pub = pubKey(v.publishedAt);
      v.engagement = isNum(v.views) && v.views > 0 ? (((v.likes || 0) + (v.comments || 0) + (v.shares || 0)) / v.views) * 100 : null;
      v.key = (v.hook || v.title || v.id).trim();
    }
    m.videos.sort((a, b) => (b.pub || "").localeCompare(a.pub || "") || (b.views || 0) - (a.views || 0));
  }

  async function liveYouTube(m) {
    if (!YOUTUBE_API_KEY || m.mode !== "real") return false;
    // Pelo servidor local a consulta passa por ele (a chave só aceita o domínio da Vercel)
    const api = (path, p) => fetch(state.api ? `/api/brazil-noir/yt/${path}?${new URLSearchParams(p)}` : `https://www.googleapis.com/youtube/v3/${path}?${new URLSearchParams({ ...p, key: YOUTUBE_API_KEY })}`).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));
    try {
      const ch = (await api("channels", { part: "snippet,statistics,contentDetails", forHandle: m.channel.youtube?.handle || "ytBrazilNoir" })).items?.[0];
      if (!ch) return false;
      const pl = await api("playlistItems", { part: "contentDetails", playlistId: ch.contentDetails.relatedPlaylists.uploads, maxResults: 50 });
      const ids = pl.items.map((i) => i.contentDetails.videoId);
      const vids = ids.length ? (await api("videos", { part: "snippet,statistics,contentDetails", id: ids.join(",") })).items : [];
      const byId = new Map(m.videos.map((v) => [v.id, v]));
      for (const it of vids) {
        const st = it.statistics;
        const stats = { views: +st.viewCount || 0, likes: st.likeCount != null ? +st.likeCount : null, comments: st.commentCount != null ? +st.commentCount : null };
        if (byId.has(it.id)) { Object.assign(byId.get(it.id), stats); continue; }
        const d = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(it.contentDetails.duration) || [];
        const secs = (+d[1] || 0) * 3600 + (+d[2] || 0) * 60 + (+d[3] || 0);
        const short = secs <= 180 && (/#shorts/i.test(it.snippet.title) || it.snippet.publishedAt >= LONGFORM_ERA);
        m.videos.push({ id: it.id, platform: short ? "yt_shorts" : "yt_long", title: it.snippet.title.replace(/\s*#shorts\b/i, ""), publishedAt: it.snippet.publishedAt, durationSec: secs,
          url: short ? `https://www.youtube.com/shorts/${it.id}` : `https://www.youtube.com/watch?v=${it.id}`, thumb: it.snippet.thumbnails?.medium?.url, ...stats, source: "youtube-live" });
      }
      m.accounts.youtube = { ...(m.accounts.youtube || {}), followers: +ch.statistics.subscriberCount, views: +ch.statistics.viewCount, videos: +ch.statistics.videoCount, asOf: new Date().toISOString() };
      const today = keyOf(new Date());
      const row = m.daily.find((r) => r.date === today && r.platform === "youtube");
      if (row) Object.assign(row, { followers: m.accounts.youtube.followers, totalViews: m.accounts.youtube.views });
      else m.daily.push({ date: today, platform: "youtube", followers: m.accounts.youtube.followers, totalViews: m.accounts.youtube.views });
      m.daily.sort((a, b) => (a.date + a.platform).localeCompare(b.date + b.platform));
      m.channel.youtube = { ...(m.channel.youtube || {}), avatar: ch.snippet.thumbnails?.medium?.url };
      m.live = true;
      finalizeVideos(m);
      m.schedule = buildSchedule(m, m.scheduleFile, m.ytScheduled);
      return true;
    } catch { return false; }
  }

  // ---------- Cálculos ----------
  const startKey = (m) => (state.period ? keyOf(addDays(m.refDate, -state.period + 1)) : "0000-00-00");
  const prevStartKey = (m) => (state.period ? keyOf(addDays(m.refDate, -2 * state.period + 1)) : null);
  const inPeriod = (m, k) => k && k >= startKey(m) && k <= m.refKey;
  const followerRows = (m, net) => m.daily.filter((r) => r.platform === net && isNum(r.followers));

  function viewsByDay(m, net) {
    const out = new Map();
    let prev = null;
    for (const r of m.daily.filter((x) => x.platform === net)) {
      if (isNum(r.views)) out.set(r.date, r.views);
      else if (isNum(r.totalViews) && prev) out.set(r.date, Math.max(0, r.totalViews - prev.totalViews));
      if (isNum(r.totalViews)) prev = r;
    }
    return out;
  }
  function gainedBetween(m, net, fromKey, toKey) {
    const rows = followerRows(m, net);
    const end = [...rows].reverse().find((r) => r.date <= toKey);
    if (!end) return null;
    const base = [...rows].reverse().find((r) => r.date < fromKey) || rows.find((r) => r.date >= fromKey);
    if (!base || base.date >= end.date) return null;
    return end.followers - base.followers;
  }
  function viewsBetween(m, fromKey, toKey) {
    let total = 0, any = false;
    for (const net of NET_ORDER) for (const [k, v] of viewsByDay(m, net)) if (k >= fromKey && k <= toKey) { total += v; any = true; }
    return any ? total : null;
  }
  function eta(m, net, goal) {
    const rows = followerRows(m, net);
    if (rows.length < 2) return "o ritmo aparece com alguns dias de histórico";
    const last = rows.at(-1);
    if (last.followers >= goal) return "meta batida";
    const from = keyOf(addDays(dateOf(last.date), -30));
    const base = rows.find((r) => r.date >= from && r.date < last.date) || rows[0];
    const span = daysBetween(base.date, last.date);
    if (span < 5) return "o ritmo aparece com alguns dias de histórico";
    const rate = (last.followers - base.followers) / span;
    if (rate <= 0) return "sem crescimento no último mês";
    const days = (goal - last.followers) / rate;
    const rateTxt = rate >= 1 ? `+${fmt1(rate)}/dia` : `+${fmt1(rate * 7)}/semana`;
    if (days > 365 * 3) return `no ritmo atual (${rateTxt}) leva mais de 3 anos`;
    return `no ritmo atual (${rateTxt}): <span class="tag">${monthYear(addDays(dateOf(last.date), Math.ceil(days)))}</span>`;
  }

  // ---------- Thumbnails ----------
  const ytId = (v) => (v.platform?.startsWith("yt_") && /^[\w-]{11}$/.test(v.id) ? v.id : null);
  window.bnThumbErr = (img) => {
    if (img.src.includes("/sddefault.jpg")) img.src = img.src.replace("/sddefault.jpg", "/mqdefault.jpg");
    else img.remove();
  };
  function thumb(v, { big = false } = {}) {
    const id = ytId(v);
    const url = id ? `https://i.ytimg.com/vi/${id}/${big ? "sddefault" : "mqdefault"}.jpg` : v.thumb;
    const color = PLAT[v.platform]?.color || "var(--muted)";
    const badge = isNum(v.durationSec) ? `<span class="dur">${dur(v.durationSec)}</span>` : "";
    if (url) return `<div class="thumb"><img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="bnThumbErr(this)">${badge}</div>`;
    return `<div class="thumb ph" style="--pc:${color}"><span class="ph-t">${esc(v.case || v.title)}</span>${badge}</div>`;
  }

  // ---------- Tooltip ----------
  const tip = $("#tip");
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.classList.add("show");
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > innerHeight - 8) top = y - r.height - 14;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.max(8, top) + "px";
  }
  const hideTip = () => tip.classList.remove("show");
  const tipRow = (color, label, value) => `<div class="tip-row"><span class="sw" style="background:${color}"></span>${esc(label)}<b>${value}</b></div>`;

  // ---------- Gráficos ----------
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const s of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (s * p >= v) return s * p;
    return 10 * p;
  }
  function frame(el, h) {
    const w = Math.max(260, el.clientWidth);
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"></svg>`;
    return { svg: el.firstChild, w, h };
  }
  function axes(svg, { w, h, m, yMax, yFmt, xKeys, xPos }) {
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = (yMax * i) / 4, y = h - m.b - ((h - m.t - m.b) * i) / 4;
      g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y}" y2="${y}" style="stroke:${i ? "var(--grid)" : "var(--axis)"}" stroke-width="1"/>`;
      g += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${yFmt(v)}</text>`;
    }
    const n = xKeys.length, ticks = Math.min(n, Math.max(2, Math.floor((w - m.l - m.r) / 90)));
    const seen = new Set();
    for (let i = 0; i < ticks; i++) {
      const idx = ticks === 1 ? 0 : Math.round((i * (n - 1)) / (ticks - 1));
      if (seen.has(idx)) continue;
      seen.add(idx);
      const anchor = ticks === 1 ? "middle" : i === 0 ? "start" : i === ticks - 1 ? "end" : "middle";
      g += `<text x="${xPos(idx)}" y="${h - 6}" text-anchor="${anchor}">${dShort(xKeys[idx])}</text>`;
    }
    svg.insertAdjacentHTML("beforeend", g);
  }

  function lineChart(el, series, { yFmt = fmtC } = {}) {
    const keys = [...new Set(series.flatMap((s) => s.points.map((p) => p.k)))].sort();
    if (!keys.length) return false;
    const { svg, w, h } = frame(el, 240);
    const longest = Math.max(...series.map((s) => (s.label + fmt(s.points.at(-1)?.v)).length));
    const m = { t: 12, r: Math.min(130, 18 + longest * 6.4), b: 26, l: 44 };
    const yMax = niceMax(Math.max(...series.flatMap((s) => s.points.map((p) => p.v))));
    const x = (i) => (keys.length === 1 ? (m.l + w - m.r) / 2 : m.l + ((w - m.l - m.r) * i) / (keys.length - 1));
    const y = (v) => h - m.b - ((h - m.t - m.b) * v) / yMax;
    const idx = new Map(keys.map((k, i) => [k, i]));
    axes(svg, { w, h, m, yMax, yFmt, xKeys: keys, xPos: x });
    let g = "";
    const ends = [];
    for (const s of series) {
      const pts = s.points.map((p) => [x(idx.get(p.k)), y(p.v)]);
      if (pts.length > 1) g += `<path d="M${pts.map((p) => p.join(",")).join("L")}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = pts.at(-1);
      g += `<circle cx="${last[0]}" cy="${last[1]}" r="4" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
      ends.push({ y: last[1], x: last[0], text: `${s.label} ${fmt(s.points.at(-1).v)}` });
    }
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    for (const e of ends) g += `<text class="lbl" x="${e.x + 9}" y="${e.y + 4}">${esc(e.text)}</text>`;
    g += `<line class="xh" y1="${m.t}" y2="${h - m.b}" style="stroke:var(--border-2);display:none" stroke-width="1"/><g class="hd"></g>`;
    g += `<rect x="${m.l}" y="0" width="${Math.max(1, w - m.l - m.r)}" height="${h}" fill="transparent" class="hit"/>`;
    svg.insertAdjacentHTML("beforeend", g);
    const xh = svg.querySelector(".xh"), hd = svg.querySelector(".hd"), hit = svg.querySelector(".hit");
    hit.addEventListener("pointermove", (ev) => {
      const px = ev.clientX - svg.getBoundingClientRect().left;
      let best = 0, bd = Infinity;
      keys.forEach((k, i) => { const d = Math.abs(x(i) - px); if (d < bd) { bd = d; best = i; } });
      const k = keys[best];
      xh.setAttribute("x1", x(best)); xh.setAttribute("x2", x(best)); xh.style.display = "";
      let rows = "", dots = "";
      for (const s of series) {
        const p = s.points.find((q) => q.k === k);
        if (!p) continue;
        rows += tipRow(s.color, s.label, fmt(p.v));
        dots += `<circle cx="${x(best)}" cy="${y(p.v)}" r="4.5" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
      }
      hd.innerHTML = dots;
      showTip(`<div class="tip-h">${dLong(k)}</div>${rows || '<div class="muted">sem leitura neste dia</div>'}`, ev.clientX, ev.clientY);
    });
    hit.addEventListener("pointerleave", () => { xh.style.display = "none"; hd.innerHTML = ""; hideTip(); });
    return true;
  }

  function stackedColumns(el, keys, series, { yFmt = fmtC } = {}) {
    if (!keys.length) return false;
    const { svg, w, h } = frame(el, 240);
    const m = { t: 12, r: 8, b: 26, l: 44 };
    const totals = keys.map((_, i) => sum(series, (s) => s.values[i]));
    const yMax = niceMax(Math.max(...totals));
    const band = (w - m.l - m.r) / keys.length;
    const bw = Math.max(2, Math.min(24, band * 0.72));
    const x = (i) => m.l + band * i + band / 2;
    const y = (v) => h - m.b - ((h - m.t - m.b) * v) / yMax;
    axes(svg, { w, h, m, yMax, yFmt, xKeys: keys, xPos: x });
    const gap = bw >= 6 ? 2 : 0;
    let g = "";
    keys.forEach((k, i) => {
      let acc = 0;
      const segs = series.map((s) => ({ s, v: s.values[i] || 0 })).filter((q) => q.v > 0);
      segs.forEach((q, j) => {
        const y0 = y(acc);
        acc += q.v;
        const top = j === segs.length - 1;
        const hgt = y0 - y(acc) - (top ? 0 : gap);
        if (hgt < 0.5) return;
        const x0 = x(i) - bw / 2, yt = y0 - hgt, r = top ? Math.min(4, bw / 2, hgt) : 0;
        g += `<path d="M${x0},${y0}V${yt + r}${r ? `Q${x0},${yt} ${x0 + r},${yt}` : ""}H${x0 + bw - r}${r ? `Q${x0 + bw},${yt} ${x0 + bw},${yt + r}` : ""}V${y0}Z" style="fill:${q.s.color}"/>`;
      });
      g += `<rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${h - m.t - m.b}" fill="transparent" data-i="${i}" class="hit"/>`;
    });
    svg.insertAdjacentHTML("afterbegin", `<rect class="ghost" x="0" y="${m.t}" width="${band}" height="${h - m.t - m.b}" style="fill:var(--surface-2);display:none" rx="4"/>`);
    svg.insertAdjacentHTML("beforeend", g);
    const ghost = svg.querySelector(".ghost");
    svg.querySelectorAll(".hit").forEach((r) => {
      r.addEventListener("pointermove", (ev) => {
        const i = +r.dataset.i;
        ghost.setAttribute("x", m.l + band * i); ghost.style.display = "";
        showTip(`<div class="tip-h">${dLong(keys[i])}</div>${series.map((s) => tipRow(s.color, s.label, fmt(s.values[i] || 0))).join("")}<div class="tip-row tip-total">Total<b>${fmt(totals[i])}</b></div>`, ev.clientX, ev.clientY);
      });
      r.addEventListener("pointerleave", () => { ghost.style.display = "none"; hideTip(); });
    });
    return true;
  }

  function spark(vids, color) {
    const list = vids.filter((v) => isNum(v.views)).slice(0, 40).reverse();
    if (!list.length) return "";
    const W = 260, H = 40, n = list.length, band = W / n, bw = Math.max(2, Math.min(10, band - 2));
    const max = Math.max(...list.map((v) => v.views), 1);
    const bars = list.map((v, i) => { const hh = Math.max(1.5, (v.views / max) * (H - 2)); return `<rect x="${i * band + (band - bw) / 2}" y="${H - hh}" width="${bw}" height="${hh}" rx="${Math.min(2, bw / 2)}" style="fill:${color}"><title>${esc(v.key)} — ${fmt(v.views)} views</title></rect>`; }).join("");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="40" aria-label="Views por vídeo">${bars}</svg>`;
  }
  function segBar(parts, max, maxPx = 100) {
    const total = sum(parts, (p) => p.v);
    const width = max > 0 ? Math.max(1, (total / max) * maxPx) : 0;
    return `<span class="sbar" style="width:${width}%">${parts.filter((p) => p.v > 0).map((p) => `<i style="flex:${p.v} 1 0;background:${p.color}" title="${esc(p.label)}: ${fmt(p.v)}"></i>`).join("")}</span>`;
  }
  const empty = (html) => `<div class="empty"><div>${html}</div></div>`;

  // ---------- Render ----------
  function render() {
    const m = state.model;
    state.pendingRender = false;
    document.querySelectorAll("#mode-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    document.querySelectorAll("#period-seg button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.period === state.period)));
    if (!m) {
      $("#main").innerHTML = empty(`<b>Não encontrei os dados.</b><br>Rode <code>npm run bn:dashboard</code> ou <code>npm run bn:dashboard:sample</code> e abra a página por um servidor local.`);
      return;
    }
    renderChrome(m);
    $("#main").innerHTML = `
      <section id="overview">
        <div class="hero"><div class="card feat" id="feat"></div><div class="card recent" id="recent"></div></div>
        <div class="kpis" id="kpis"></div>
      </section>
      <section class="block" id="schedule"><div class="block-h"><h2>Programados</h2><span class="sub">o que já está agendado no YouTube, TikTok e Reels</span><span class="right" id="sched-btn"></span></div><div id="sched-form"></div><div class="grid2" id="sched"></div></section>
      <section class="block" id="growth"><div class="block-h"><h2>Crescimento</h2><span class="sub">seguidores e views ao longo do tempo</span><span class="right" id="growth-aside"></span></div>
        <div class="grid2">
          <div class="card"><div class="card-h"><span class="card-title">Seguidores por rede</span></div><div class="legend" id="lg-followers"></div><div class="chart" id="ch-followers"></div></div>
          <div class="card"><div class="card-h"><span class="card-title">Views por dia</span></div><div class="legend" id="lg-views"></div><div class="chart" id="ch-views"></div><div id="tbl-views"></div></div>
        </div></section>
      <section class="block" id="money"><div class="block-h"><h2>Monetização</h2><span class="sub">progresso nas metas oficiais de cada programa</span></div><div class="grid3" id="goals"></div></section>
      <section class="block" id="platforms"><div class="block-h"><h2>Plataformas</h2><span class="sub" id="plat-aside"></span></div><div class="grid4" id="plats"></div></section>
      <section class="block" id="highlights"><div class="block-h"><h2>Destaques</h2><span class="sub">o que rendeu mais e menos no período</span></div><div class="grid2" id="hl"></div></section>
      <section class="block" id="videos"><div class="block-h"><h2>Vídeos</h2><span class="right" id="videos-aside"></span></div><div class="card" id="vtable"></div></section>
      <section class="block" id="spend"><div class="block-h"><h2>Gastos</h2><span class="sub">impulsionamentos, ferramentas e outros custos do canal</span><span class="right" id="spend-btn"></span></div><div id="spend-form"></div><div id="spendbox"></div></section>
      <section class="block" id="sources"><div class="block-h"><h2>Fontes de dados</h2><span class="sub">o que está ligado e o que falta</span></div><div class="card" id="srcs"></div></section>`;
    renderFeatured(m);
    renderRecent(m);
    renderKpis(m);
    renderSchedule(m);
    renderGrowth(m);
    renderGoals(m);
    renderPlatforms(m);
    renderHighlights(m);
    renderVideos(m);
    renderSpend(m);
    renderSources(m);
    spy();
  }

  function sourceFlags(m) {
    const sample = m.mode === "sample";
    return {
      yt: sample || !!(m.sources.youtube || m.live),
      ana: sample || String(m.sources.youtube || "").includes("analytics"),
      tk: sample || m.sources.tiktok ? "on" : m.manualUsed.tiktok ? "part" : "off",
      ig: sample || m.sources.instagram ? "on" : m.manualUsed.instagram ? "part" : "off",
    };
  }

  function renderChrome(m) {
    const yt = m.channel.youtube || {};
    $("#avatar").innerHTML = yt.avatar && m.mode === "real" ? `<img src="${esc(yt.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mark'}))">` : `<span class="mark"></span>`;
    const f = sourceFlags(m);
    const row = (s, t) => `<div><span class="dot ${s}"></span>${t}</div>`;
    $("#side-src").innerHTML = [
      row(f.yt ? "on" : "off", `YouTube${m.live ? " · ao vivo" : ""}`),
      row(f.ana ? "on" : "off", f.ana ? "Retenção YouTube" : "Retenção YT · falta OAuth"),
      row(f.tk, `TikTok${f.tk === "part" ? " · manual" : f.tk === "off" ? " · sem dados" : ""}`),
      row(f.ig, `Reels${f.ig === "off" ? " · não ligado" : f.ig === "part" ? " · manual" : ""}`),
      row(m.spend.length ? "on" : "off", `Gastos · ${m.spend.length}`),
    ].join("");
    const when = m.mode === "sample" ? "Dados de exemplo" : m.generatedAt ? `Atualizado em ${new Date(m.generatedAt).toLocaleString("pt-BR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }).replace(/\./g, "")}${m.live ? " · YouTube ao vivo" : ""}` : "";
    $("#when").textContent = when;
    $("#notice").innerHTML = m.mode === "sample" ? `<div class="notice"><span class="tag">Exemplo</span><span>Números inventados para mostrar o painel completo. <button type="button" id="to-real">Ver dados reais</button></span></div>` : "";
    $("#to-real")?.addEventListener("click", () => setMode("real"));
    $("#foot").textContent = m.mode === "sample" ? "modo exemplo" : `referência: ${dLong(m.refKey)}`;
  }

  // Melhor vídeo do período (por métrica escolhida), com player do YouTube
  const FEAT_METRICS = {
    views: { label: "Views", get: (v) => v.views },
    ret: { label: "Retenção", get: (v) => (v.views >= 30 ? v.avgViewPct : null) },
    fol: { label: "Seguidores", get: (v) => v.followersGained },
  };
  function renderFeatured(m) {
    const el = $("#feat");
    let pool = m.videos.filter((v) => inPeriod(m, v.pub) && isNum(v.views));
    const scope = pool.length ? (state.period ? `nos últimos ${state.period} dias` : "de todos os tempos") : "de todos os tempos";
    if (!pool.length) pool = m.videos.filter((v) => isNum(v.views));
    if (!pool.length) { el.innerHTML = `<div style="padding:18px">${empty("<b>Nenhum vídeo com métricas ainda.</b>")}</div>`; return; }
    const avail = Object.entries(FEAT_METRICS).filter(([, d]) => pool.filter((v) => isNum(d.get(v))).length >= 2).map(([k]) => k);
    if (!avail.includes(state.featMetric)) state.featMetric = "views";
    const get = FEAT_METRICS[state.featMetric].get;
    const v = pool.filter((x) => isNum(get(x))).sort((a, b) => get(b) - get(a))[0];
    const meta = PLAT[v.platform];
    const peers = pool.filter((x) => x.platform === v.platform && x !== v);
    const med = median(peers.map((x) => x.views));
    const cmp = isNum(med) && med > 0 && v.views > med ? `<div class="feat-cmp"><b>${fmt1(v.views / med)}×</b> a mediana de views do ${meta.short} no período (${fmt(med)}).</div>` : "";
    const id = ytId(v);
    const others = m.videos.filter((x) => x !== v && x.key === v.key && x.pub === v.pub);
    const alsoOn = others.length ? `<span>também no ${others.map((x) => `${PLAT[x.platform].short}: ${fmtC(x.views)} view${x.views === 1 ? "" : "s"}`).join(", ")}</span>` : "";
    const stat = (label, value) => `<div><span>${label}</span><b class="num">${value}</b></div>`;
    el.innerHTML = `
      <div class="feat-media" id="feat-media">
        ${thumb(v, { big: true })}
        <span class="feat-badge"><span class="sw" style="background:${meta.color};border-radius:50%;width:8px;height:8px"></span>Melhor vídeo ${scope} · ${FEAT_METRICS[state.featMetric].label.toLowerCase()}</span>
        ${id ? `<button class="play" type="button" aria-label="Assistir aqui"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg></span></button>` : ""}
      </div>
      <div class="feat-body">
        <div class="feat-top">
          <div style="min-width:0">
            <h3 class="feat-title">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title)}</h3>
            <div class="feat-meta"><span class="chip"><i class="sw" style="background:${meta.color}"></i>${meta.label}</span><span>${dLong(v.pub)} · ${ago(v.pub, m.refKey)}</span>${v.case ? `<span>${esc(v.case)}</span>` : ""}${alsoOn}</div>
          </div>
          ${avail.length > 1 ? `<div class="seg feat-tabs" role="group" aria-label="Critério">${avail.map((k) => `<button data-fm="${k}" aria-pressed="${k === state.featMetric}">${FEAT_METRICS[k].label}</button>`).join("")}</div>` : ""}
        </div>
        ${v.hook && v.hook !== v.title ? `<div class="feat-hook">“${esc(v.hook)}”</div>` : ""}
        <div class="feat-stats">
          ${stat("Views", fmt(v.views))}
          ${stat("Retenção", isNum(v.avgViewPct) ? `${pct(v.avgViewPct, 0)} <span class="muted" style="display:inline;font-size:12px;font-weight:500">${dur(v.avgWatchSec)}</span>` : "—")}
          ${stat("Likes", fmt(v.likes))}
          ${stat("Comentários", fmt(v.comments))}
          ${stat("Compart.", fmt(v.shares))}
          ${stat("Seguidores", isNum(v.followersGained) ? "+" + fmt(v.followersGained) : "—")}
        </div>
        ${cmp}
      </div>`;
    el.querySelector(".play")?.addEventListener("click", () => {
      $("#feat-media").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    });
    el.querySelectorAll("[data-fm]").forEach((b) => b.addEventListener("click", () => { state.featMetric = b.dataset.fm; renderFeatured(m); }));
  }

  // Recentes: o mesmo corte postado em várias redes no mesmo dia vira uma linha
  function renderRecent(m) {
    const el = $("#recent");
    const groups = [];
    const byKey = new Map();
    for (const v of m.videos) {
      if (!v.pub) continue;
      const k = v.key + "|" + v.pub;
      let g = byKey.get(k);
      if (!g) { g = { key: v.key, title: v.title, case: v.case, pub: v.pub, items: [] }; byKey.set(k, g); groups.push(g); }
      g.items.push(v);
    }
    const all = groups.map((g) => ({ ...g, views: sum(g.items, (x) => x.views) }));
    const med = median(all.slice(0, 30).map((g) => g.views));
    const recent = all.slice(0, 6);
    const perf = (g) => {
      if (!isNum(med) || med <= 0 || daysBetween(g.pub, m.refKey) < 2) return `<span class="perf mid">${daysBetween(g.pub, m.refKey) < 2 ? "rodando" : "—"}</span>`;
      const r = g.views / med;
      return r >= 1.5 ? `<span class="perf up">▲ ${fmt1(r)}× a mediana</span>` : r <= 0.6 ? `<span class="perf down">▼ abaixo do normal</span>` : `<span class="perf mid">na média</span>`;
    };
    const lead = (g) => g.items.find((x) => ytId(x)) || g.items[0];
    const upcoming = m.schedule.filter((i) => i.when > m.refDate);
    if (!state.sideTab) state.sideTab = "recent";
    const tabs = `<div class="tabs" role="tablist">
        <button role="tab" data-side="recent" aria-selected="${state.sideTab === "recent"}">Publicados</button>
        <button role="tab" data-side="next" aria-selected="${state.sideTab === "next"}">Programados <span class="count">${upcoming.length}</span></button>
        <span class="spacer"></span><a class="link" style="align-self:center" href="${state.sideTab === "next" ? "#schedule" : "#videos"}">${state.sideTab === "next" ? "Ver agenda" : "Ver todos"}</a>
      </div>`;
    const wire = () => el.querySelectorAll("[data-side]").forEach((b) => b.addEventListener("click", () => { state.sideTab = b.dataset.side; renderRecent(m); }));
    if (state.sideTab === "next") {
      el.innerHTML = tabs + (upcoming.length ? `<ul class="rlist">${upcoming.slice(0, 6).map((it) => `<li>${schedThumb(it)}<div style="min-width:0">
          <div class="r-title">${esc(it.title)}</div>
          <div class="r-meta"><span class="when-chip">${whenLabel(it.when)}</span><span class="soon">${untilLabel(it.when, m.refDate)}</span>${it.kind === "episodio" ? '<span class="kind">Episódio</span>' : ""}</div>
          <div class="r-plats">${it.platforms.map((p) => `<span class="chip"><i class="sw" style="background:${PLAT[p].color}"></i>${PLAT[p].short}</span>`).join("")}</div>
        </div></li>`).join("")}</ul>` : empty(`Nada programado.${m.mode === "real" ? '<br><a class="link" href="#schedule">Programar um vídeo</a>' : ""}`));
      return wire();
    }
    el.innerHTML = tabs + `
      ${recent.length ? `<ul class="rlist">${recent.map((g) => {
        const v = lead(g);
        return `<li>${thumb(v)}<div style="min-width:0">
          <div class="r-title">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>` : esc(g.title)}</div>
          <div class="r-meta"><span>${ago(g.pub, m.refKey)}</span><b class="num" style="color:var(--ink);font-weight:600">${fmtC(g.views)} views</b>${perf(g)}</div>
          <div class="r-plats">${PLAT_ORDER.map((p) => g.items.filter((x) => x.platform === p)).filter((l) => l.length).map((l) => `<span class="chip"><i class="sw" style="background:${PLAT[l[0].platform].color}"></i>${PLAT[l[0].platform].short} ${fmtC(sum(l, (x) => x.views))}</span>`).join("")}</div>
        </div></li>`;
      }).join("")}</ul>` : empty("Nenhum vídeo publicado ainda.")}`;
    wire();
  }

  // ---------- Programados ----------
  const whenLabel = (d) => `${d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" }).replace(/\./g, "").replace(/ de /g, " ")} · ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
  const timeLabel = (d) => d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  function untilLabel(d, ref) {
    const days = daysBetween(keyOf(ref), keyOf(d));
    if (days <= 0) { const min = Math.round((d - ref) / 6e4); return min < 60 ? `em ${Math.max(1, min)} min` : `hoje, em ${Math.round(min / 60)} h`; }
    return days === 1 ? "amanhã" : `em ${days} dias`;
  }
  function schedThumb(it) {
    const v = it.matches?.[0];
    if (v) return thumb(v);
    return thumb({ id: it.ytId || "", platform: it.platforms[0] || "tiktok", durationSec: it.durationSec, case: it.case, title: it.title, thumb: it.thumb });
  }
  function schedStatus(it, ref) {
    if (it.published) return `<span class="st ok">✓ publicado</span>`;
    const hours = (ref - it.when) / 36e5;
    const onYt = it.platforms.some((p) => p.startsWith("yt_"));
    if (onYt && hours > 2) return `<span class="st warn" title="Não achei um vídeo com esse título no YouTube">não apareceu no YouTube</span>`;
    return `<span class="st mid" title="TikTok e Reels não têm como ser conferidos pela API">sem confirmação</span>`;
  }

  function renderSchedule(m) {
    const ref = m.refDate;
    const canEdit = m.mode === "real";
    $("#sched-btn").innerHTML = `<button class="btn primary" id="new-sched" type="button" ${canEdit ? "" : 'disabled title="Troque para Dados reais para programar"'}>${ICON.plus}Programar vídeo</button>`;
    $("#new-sched")?.addEventListener("click", () => openScheduleForm(m, null));
    const upcoming = m.schedule.filter((i) => i.when > ref);
    const past = m.schedule.filter((i) => i.when <= ref && ref - i.when < 7 * 864e5).reverse();
    const actions = (it) => (it.source === "manual" && editable(m) && it.id
      ? `<span class="row-act"><button type="button" title="Editar" aria-label="Editar" data-edit-sched="${esc(it.id)}">${ICON.edit}</button><button type="button" class="del" title="Excluir" aria-label="Excluir" data-del-sched="${esc(it.id)}">${ICON.del}</button></span>`
      : it.source === "youtube" ? `<span class="st mid" title="Agendado no YouTube Studio; edite por lá">YouTube Studio</span>` : "");
    const row = (it, extra) => `<div class="agenda-row"><span class="time">${timeLabel(it.when)}</span>${schedThumb(it)}<div style="min-width:0">
        <div class="t">${esc(it.title)}</div>
        <div class="m">${it.platforms.map((p) => `<span class="chip"><i class="sw" style="background:${PLAT[p].color}"></i>${PLAT[p].short}</span>`).join("")}${it.kind === "episodio" ? '<span class="kind">Episódio</span>' : ""}${it.case ? `<span>${esc(it.case)}</span>` : ""}${it.note ? `<span>${esc(it.note)}</span>` : ""}</div>
      </div><span style="display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap">${extra || ""}${actions(it)}</span></div>`;
    const byDay = new Map();
    for (const it of upcoming) { const k = keyOf(it.when); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(it); }
    const dayTitle = (k) => {
      const d = daysBetween(m.refKey, k);
      const name = dateOf(k).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
      return d === 0 ? `Hoje · ${name}` : d === 1 ? `Amanhã · ${name}` : name.charAt(0).toUpperCase() + name.slice(1);
    };
    $("#sched").innerHTML = `
      <div class="card"><div class="card-h"><span class="card-title">Próximos</span><span class="card-sub">${upcoming.length} programado${upcoming.length === 1 ? "" : "s"}</span></div>
        ${upcoming.length ? [...byDay].map(([k, list]) => `<div class="agenda-day"><h4>${dayTitle(k)}</h4>${list.map((it) => row(it)).join("")}</div>`).join("") : empty(`<b>Nada programado.</b><br>Use <b>Programar vídeo</b> para registrar o que você agendou no YouTube Studio, no TikTok ou no Instagram.${m.ytScheduled.length || m.mode === "sample" ? "" : "<br>Com o OAuth do YouTube ligado, os agendados do Studio aparecem sozinhos."}`)}
      </div>
      <div class="card"><div class="card-h"><span class="card-title">Últimos 7 dias</span><span class="card-sub">o que estava programado e já passou</span></div>
        ${past.length ? past.map((it) => row(it, schedStatus(it, ref))).join("") : empty("Nada programado nos últimos 7 dias.")}
      </div>`;
    document.querySelectorAll("[data-edit-sched]").forEach((b) => b.addEventListener("click", () => openScheduleForm(m, m.scheduleFile.entries.find((x) => x.id === b.dataset.editSched))));
    document.querySelectorAll("[data-del-sched]").forEach((b) => b.addEventListener("click", async () => {
      const e = m.scheduleFile.entries.find((x) => x.id === b.dataset.delSched);
      if (!e || !confirm(`Excluir o programado "${e.title}" (${whenLabel(new Date(e.at))})?`)) return;
      const res = await fetch(`/api/brazil-noir/schedule/${encodeURIComponent(e.id)}`, { method: "DELETE", headers: { "Content-Type": "application/json" } });
      if (!res.ok) return toast("Não consegui excluir");
      await refresh();
      toast("Programado excluído");
    }));
  }

  function openScheduleForm(m, entry) {
    const box = $("#sched-form");
    if (!state.api) {
      box.innerHTML = `<div class="notice"><span class="tag">Só leitura</span><span>Esta página está sem o servidor local, então não consegue gravar. Abra a dashboard pelo atalho <b>Brazil Noir - Dashboard</b> da área de trabalho para programar por aqui.</span></div>`;
      box.scrollIntoView({ block: "nearest" });
      return;
    }
    const e = entry || { at: `${keyOf(addDays(new Date(), 1))}T19:00`, kind: "corte", platforms: ["tiktok", "yt_shorts", "reels"], title: "", case: "" };
    const cases = [...new Set(m.videos.map((v) => v.case).concat(m.schedule.map((i) => i.case)).filter(Boolean))];
    box.innerHTML = `<div class="card form-card">
      <div class="card-h"><span class="card-title">${entry ? "Editar programado" : "Programar vídeo"}</span><span class="card-sub">grava em <code>schedule.json</code></span></div>
      <form class="form" id="sched-f" novalidate autocomplete="off">
        <div class="field"><label for="s-at">Data e hora</label><input id="s-at" name="at" type="datetime-local" required value="${esc(e.at)}"></div>
        <div class="field"><label for="s-kind">Tipo</label><select id="s-kind" name="kind"><option value="corte" ${e.kind !== "episodio" ? "selected" : ""}>Corte</option><option value="episodio" ${e.kind === "episodio" ? "selected" : ""}>Episódio</option></select></div>
        <div class="field w2"><label for="s-title">Título (igual ao do post)</label><input id="s-title" name="title" required maxlength="140" placeholder="o mesmo título usado na rede" value="${esc(e.title)}"></div>
        <div class="field"><label for="s-case">Caso</label><input id="s-case" name="case" list="s-cases" maxlength="80" placeholder="opcional" value="${esc(e.case || "")}"><datalist id="s-cases">${cases.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></div>
        <div class="field"><label for="s-note">Observação</label><input id="s-note" name="note" maxlength="200" placeholder="opcional" value="${esc(e.note || "")}"></div>
        <div class="field w3"><label>Redes</label><div class="checks">${PLAT_ORDER.map((p) => `<label><input type="checkbox" name="platforms" value="${p}" ${e.platforms?.includes(p) ? "checked" : ""}>${p === "yt_long" ? "YouTube longo" : PLAT[p].short}</label>`).join("")}</div></div>
        <div class="form-actions"><span class="msg" id="s-msg"></span><button type="button" class="btn" id="s-cancel">Cancelar</button><button type="submit" class="btn primary" id="s-save">${entry ? "Salvar alterações" : "Programar"}</button></div>
      </form></div>`;
    const f = $("#sched-f");
    $("#s-cancel").addEventListener("click", () => { box.innerHTML = ""; flushRender(); });
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const msg = $("#s-msg");
      const platforms = [...f.querySelectorAll('input[name="platforms"]:checked')].map((x) => x.value);
      if (!f.at.value || !f.title.value.trim() || !platforms.length) { msg.className = "msg err"; msg.textContent = "Preencha data e hora, título e pelo menos uma rede."; return; }
      const body = { at: f.at.value.slice(0, 16), kind: f.kind.value, title: f.title.value.trim(), platforms, case: f.case.value.trim() || null, note: f.note.value.trim() || null };
      $("#s-save").disabled = true;
      msg.className = "msg"; msg.textContent = "Salvando…";
      try {
        const res = await fetch(`/api/brazil-noir/schedule${entry ? "/" + encodeURIComponent(entry.id) : ""}`, { method: entry ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || `erro ${res.status}`);
        await refresh();
        toast(entry ? "Programado atualizado" : `Programado: ${whenLabel(new Date(body.at))}`);
      } catch (err) {
        $("#s-save").disabled = false;
        msg.className = "msg err"; msg.textContent = `Não salvou: ${err.message}`;
      }
    });
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    f.title.focus({ preventScroll: true });
  }

  function renderKpis(m) {
    const s = startKey(m), ps = prevStartKey(m), prevEnd = state.period ? keyOf(addDays(m.refDate, -state.period)) : null;
    const per = state.period ? `em ${state.period} dias` : "desde o início";
    const nets = NET_ORDER.filter((n) => isNum(m.accounts[n]?.followers));
    const audience = sum(nets, (n) => m.accounts[n].followers);
    const gained = nets.map((n) => gainedBetween(m, n, s, m.refKey)).filter(isNum);
    const gainedTotal = gained.length ? sum(gained, (x) => x) : null;
    let views = viewsBetween(m, s, m.refKey), viewsLabel = "Views no período", viewsSub = per;
    const prevViews = ps ? viewsBetween(m, ps, prevEnd) : null;
    if (!isNum(views)) { views = sum(NET_ORDER, (n) => m.accounts[n]?.views); viewsLabel = "Views totais"; viewsSub = "histórico diário ainda curto"; }
    else if (isNum(prevViews) && prevViews > 0) { const d = ((views - prevViews) / prevViews) * 100; viewsSub = `<span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${fmt1(Math.abs(d))}%</span> vs. ${state.period} dias anteriores`; }
    const pubs = m.videos.filter((v) => inPeriod(m, v.pub));
    const spent = m.spend.filter((e) => inPeriod(m, e.date));
    const spentTotal = sum(spent, (e) => e.amount);
    const cpf = gainedTotal > 0 && spentTotal > 0 ? spentTotal / gainedTotal : null;
    const kpi = (label, value, sub) => `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value num">${value}</div><div class="kpi-sub">${sub}</div></div>`;
    $("#kpis").innerHTML = [
      kpi("Seguidores (todas as redes)", fmt(audience), isNum(gainedTotal) ? `<span class="delta ${gainedTotal >= 0 ? "up" : "down"}">${gainedTotal >= 0 ? "+" : ""}${fmt(gainedTotal)}</span> ${per}` : nets.map((n) => `${NETS[n].label} ${fmtC(m.accounts[n].followers)}`).join(" · ") || "sem dados"),
      kpi(viewsLabel, fmtC(views), viewsSub),
      kpi("Vídeos publicados", fmt(pubs.length), PLAT_ORDER.map((p) => [p, pubs.filter((v) => v.platform === p).length]).filter(([, n]) => n).map(([p, n]) => `${PLAT[p].short} ${n}`).join(" · ") || per),
      kpi("Gasto", brl(spentTotal), spentTotal ? per : `nada lançado ${per}`),
      kpi("Custo por seguidor", cpf ? brl(cpf) : "—", cpf ? "gasto ÷ seguidores ganhos" : "precisa de gasto e histórico"),
    ].join("");
  }

  function renderGrowth(m) {
    const s = startKey(m);
    const fSeries = NET_ORDER.map((n) => ({ label: NETS[n].label, color: NETS[n].color, points: followerRows(m, n).filter((r) => r.date >= s).map((r) => ({ k: r.date, v: r.followers })) })).filter((x) => x.points.length);
    const npts = Math.max(0, ...fSeries.map((x) => x.points.length));
    $("#lg-followers").innerHTML = (fSeries.length > 1 ? fSeries.map((x) => `<span><i class="sw" style="background:${x.color}"></i>${x.label}</span>`).join("") : "") + (fSeries.length && npts < 3 ? `<span class="muted">histórico começou agora (${npts} leitura${npts > 1 ? "s" : ""}); a curva se forma com as próximas coletas</span>` : "");
    const fEl = $("#ch-followers");
    if (!fSeries.length) fEl.innerHTML = empty("<b>Sem leituras de seguidores no período.</b><br>Cada coleta (ou snapshot em <code>manual.json</code>) adiciona um ponto.");
    else lineChart(fEl, fSeries);

    const maps = NET_ORDER.map((n) => [n, viewsByDay(m, n)]);
    const allKeys = [...new Set(maps.flatMap(([, mp]) => [...mp.keys()]))].filter((k) => k >= s).sort();
    let keys = allKeys;
    if (allKeys.length > 1) { keys = []; for (let d = dateOf(allKeys[0]); keyOf(d) <= allKeys.at(-1); d = addDays(d, 1)) keys.push(keyOf(d)); }
    const vSeries = maps.filter(([, mp]) => [...mp.values()].some((v) => v > 0)).map(([n, mp]) => ({ label: NETS[n].label, color: NETS[n].color, values: keys.map((k) => mp.get(k) || 0) }));
    $("#lg-views").innerHTML = vSeries.map((x) => `<span><i class="sw" style="background:${x.color}"></i>${x.label}</span>`).join("");
    if (!vSeries.length || !keys.length) {
      $("#ch-views").innerHTML = empty("<b>Ainda não há views diárias.</b><br>Aparecem a partir da segunda coleta, ou na hora com o YouTube Analytics ligado.");
      $("#tbl-views").innerHTML = "";
    } else {
      stackedColumns($("#ch-views"), keys, vSeries);
      const rows = keys.slice().reverse().slice(0, 60).map((k, i) => `<tr><td>${dLong(k)}</td>${vSeries.map((x) => `<td class="r">${fmt(x.values[keys.length - 1 - i])}</td>`).join("")}</tr>`).join("");
      $("#tbl-views").innerHTML = `<details class="data"><summary>Ver em tabela</summary><div class="tbl-wrap" style="max-height:260px"><table><thead><tr><th>Dia</th>${vSeries.map((x) => `<th class="r">${x.label}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
    }
    const g = NET_ORDER.map((n) => gainedBetween(m, n, s, m.refKey)).filter(isNum);
    $("#growth-aside").textContent = g.length ? `${sum(g, (x) => x) >= 0 ? "+" : ""}${fmt(sum(g, (x) => x))} seguidores ${state.period ? `em ${state.period} dias` : "no histórico"}` : "";
  }

  function meter({ label, value, goal, color, fmtV = fmt, sub = "", est = false }) {
    const p = isNum(value) ? Math.min(100, (value / goal) * 100) : 0;
    const left = isNum(value) ? Math.max(0, goal - value) : null;
    const pTxt = isNum(value) ? (p < 1 && p > 0 ? p.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) : fmt1(p)) + "%" : "sem dado";
    return `<div>
      <div class="meter-top"><span class="meter-label">${label}${est ? ` <span class="est" title="Estimativa: ligue a fonte oficial para o número exato">≈ estimado</span>` : ""}</span><span class="meter-val num"><b>${isNum(value) ? fmtV(value) : "—"}</b> / ${fmtV(goal)}</span></div>
      <div class="track" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${isNum(value) ? Math.round(value) : 0}"><div class="fill ${isNum(value) && value > 0 ? "" : "zero"}" style="width:${p}%;background:${color}"></div></div>
      <div class="meter-sub">${pTxt}${isNum(left) && left > 0 ? ` · faltam ${fmtV(left)}` : isNum(left) ? " · ✓ atingido" : ""}${sub ? ` · ${sub}` : ""}</div>
    </div>`;
  }

  function renderGoals(m) {
    const yt = m.accounts.youtube || {}, tk = m.accounts.tiktok || {};
    const ref = m.refDate;
    const k365 = keyOf(addDays(ref, -365)), k90 = keyOf(addDays(ref, -90)), k30 = keyOf(addDays(ref, -30));
    const ytVids = m.videos.filter((v) => v.net === "youtube");
    let hours = yt.longWatchHours12m, hoursEst = false;
    if (!isNum(hours)) {
      hoursEst = true;
      hours = sum(ytVids.filter((v) => v.platform === "yt_long" && v.pub >= k365), (v) => (isNum(v.watchHours) ? v.watchHours : isNum(v.avgWatchSec) ? (v.views * v.avgWatchSec) / 3600 : ((v.views || 0) * (v.durationSec || 0) * 0.4) / 3600));
    }
    let shorts90 = yt.shortsViews90d, shortsEst = false;
    if (!isNum(shorts90)) { shortsEst = true; shorts90 = sum(ytVids.filter((v) => v.platform === "yt_shorts" && v.pub >= k90), (v) => v.views); }
    const uploads90 = ytVids.filter((v) => v.pub >= k90).length;
    const subs = yt.followers;
    const ytC = NETS.youtube.color, shC = PLAT.yt_shorts.color, tkC = NETS.tiktok.color;
    const hoursFmt = (v) => fmt(v) + " h";
    const fullDone = subs >= 1000 && (hours >= 4000 || shorts90 >= 1e7);
    const lowDone = subs >= 500 && uploads90 >= 3 && (hours >= 3000 || shorts90 >= 3e6);
    const tkDaily = viewsByDay(m, "tiktok");
    let tk30 = null, tk30Est = false;
    const dk = [...tkDaily.keys()].filter((k) => k >= k30);
    if (dk.length >= 20) tk30 = sum(dk, (k) => tkDaily.get(k));
    else { const recent = m.videos.filter((v) => v.platform === "tiktok" && v.pub >= k30); if (recent.length) { tk30 = sum(recent, (v) => v.views); tk30Est = true; } }
    const tkRecent = m.videos.filter((v) => v.platform === "tiktok" && v.pub >= k30);
    const tkLong = tkRecent.filter((v) => (v.durationSec || 0) > 60).length;
    const tkDone = tk.followers >= 10000 && tk30 >= 100000;
    const pill = (ok) => `<span class="pill ${ok ? "ok" : ""}">${ok ? "Elegível" : "Em andamento"}</span>`;
    $("#goals").innerHTML = `
      <div class="card goal">
        <div class="goal-top"><div><div class="goal-name">YouTube Partner Program</div><div class="goal-req">Receita de anúncios · 1.000 inscritos + um dos caminhos</div></div>${pill(fullDone)}</div>
        ${meter({ label: "Inscritos", value: subs, goal: 1000, color: ytC, sub: eta(m, "youtube", 1000) })}
        ${meter({ label: "Horas de exibição (12 meses)", value: hours, goal: 4000, color: ytC, fmtV: hoursFmt, est: hoursEst, sub: "só vídeos longos públicos" })}
        <div class="or">ou</div>
        ${meter({ label: "Views de Shorts (90 dias)", value: shorts90, goal: 1e7, color: shC, fmtV: fmtC, est: shortsEst })}
        ${hoursEst ? `<div class="goal-foot">Horas e views de Shorts estimadas pelas views públicas. O número oficial vem do YouTube Analytics (ver <a href="#sources">Fontes de dados</a>).</div>` : ""}
      </div>
      <div class="card goal">
        <div class="goal-top"><div><div class="goal-name">YPP · nível inicial</div><div class="goal-req">Clubes de canais, Super Thanks e compras</div></div>${pill(lowDone)}</div>
        ${meter({ label: "Inscritos", value: subs, goal: 500, color: ytC, sub: eta(m, "youtube", 500) })}
        ${meter({ label: "Envios públicos (90 dias)", value: uploads90, goal: 3, color: ytC })}
        ${meter({ label: "Horas de exibição (12 meses)", value: hours, goal: 3000, color: ytC, fmtV: hoursFmt, est: hoursEst })}
        <div class="or">ou</div>
        ${meter({ label: "Views de Shorts (90 dias)", value: shorts90, goal: 3e6, color: shC, fmtV: fmtC, est: shortsEst })}
      </div>
      <div class="card goal">
        <div class="goal-top"><div><div class="goal-name">TikTok Creator Rewards</div><div class="goal-req">Paga por views de vídeos com mais de 1 minuto</div></div>${pill(tkDone)}</div>
        ${meter({ label: "Seguidores", value: tk.followers, goal: 10000, color: tkC, sub: isNum(tk.followers) ? eta(m, "tiktok", 10000) : "lance em manual.json ou ligue a API" })}
        ${meter({ label: "Views nos últimos 30 dias", value: tk30, goal: 100000, color: tkC, fmtV: fmtC, est: tk30Est, sub: tk30Est ? "soma dos vídeos postados no período" : "" })}
        <div class="meter-sub">${tkRecent.length ? `<b style="color:var(--ink)">${tkLong} de ${tkRecent.length}</b> vídeos dos últimos 30 dias têm mais de 1 minuto.` : "Sem vídeos do TikTok registrados nos últimos 30 dias."}</div>
        <div class="goal-foot">Também exige conta pessoal, 18+ e país elegível. Confirme no TikTok Studio se o programa aparece para a conta.</div>
      </div>`;
  }

  function renderPlatforms(m) {
    const vids = m.videos.filter((v) => inPeriod(m, v.pub));
    $("#plat-aside").textContent = state.period ? `vídeos publicados nos últimos ${state.period} dias` : "todos os vídeos";
    $("#plats").innerHTML = PLAT_ORDER.map((p) => {
      const meta = PLAT[p];
      const list = vids.filter((v) => v.platform === p);
      const head = `<div class="plat-h"><i class="sw" style="background:${meta.color}"></i><span class="card-title">${meta.label}</span>${list.length ? `<span class="card-sub" style="margin-left:auto">${list.length} vídeo${list.length > 1 ? "s" : ""}</span>` : ""}</div>`;
      if (!list.length) {
        const ever = m.videos.some((v) => v.platform === p);
        const why = ever ? `Nenhum vídeo publicado ${state.period ? `nos últimos ${state.period} dias` : ""}.` : p === "reels" ? "Instagram ainda não ligado. Lance Reels em <code>manual.json</code> ou configure a Graph API." : p === "tiktok" ? "Sem métricas por vídeo ainda. Lance em <code>manual.json</code> até o escopo <code>video.list</code> ser aprovado." : "Sem vídeos nesta plataforma.";
        return `<div class="card plat">${head}<div class="card-sub" style="line-height:1.55">${why}</div></div>`;
      }
      const views = sum(list, (v) => v.views);
      const w = list.filter((v) => v.views > 0);
      const tv = sum(w, (v) => v.views);
      const eng = tv ? (sum(w, (v) => (v.likes || 0) + (v.comments || 0) + (v.shares || 0)) / tv) * 100 : null;
      const retL = list.filter((v) => isNum(v.avgViewPct) && v.views > 0);
