      stackedColumns(vEl, keys, vSeries);
      const rows = keys.slice().reverse().filter((_, i) => i < 60).map((k, i) => `<tr><td>${dLong(k)}</td>${vSeries.map((x) => `<td class="r">${fmt(x.values[keys.length - 1 - i])}</td>`).join("")}</tr>`).join("");
      $("#tbl-views").innerHTML = `<details class="data"><summary>Ver em tabela</summary><div class="tbl-wrap" style="max-height:260px"><table><thead><tr><th>Dia</th>${vSeries.map((x) => `<th class="r">${x.label}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
    }
    const growthTotal = NET_ORDER.map((n) => gainedBetween(m, n, s, m.refKey)).filter(isNum);
    $("#growth-aside").textContent = growthTotal.length ? `${sum(growthTotal, (x) => x) >= 0 ? "+" : ""}${fmt(sum(growthTotal, (x) => x))} seguidores ${state.period ? `em ${state.period} dias` : "no histórico"}` : "";
  }

  function renderPlatforms(m) {
    const vids = m.videos.filter((v) => inPeriod(m, v.pub));
    $("#plat-aside").textContent = state.period ? `vídeos publicados nos últimos ${state.period} dias` : "todos os vídeos";
    $("#platforms").innerHTML = PLAT_ORDER.map((p) => {
      const meta = PLAT[p];
      const list = vids.filter((v) => v.platform === p);
      const everHad = m.videos.some((v) => v.platform === p);
      if (!list.length) {
        const why = everHad ? `Nenhum vídeo publicado ${state.period ? `nos últimos ${state.period} dias` : ""}.` : p === "reels" ? "Instagram ainda não ligado. Lance Reels em <code>manual.json</code> ou configure a Graph API." : p === "tiktok" ? "API do TikTok sem métricas ainda. Lance os vídeos em <code>manual.json</code> enquanto o escopo <code>video.list</code> não é aprovado." : "Sem vídeos nesta plataforma.";
        return `<div class="card plat off" style="--pc:${meta.color}"><div class="plat-h"><i class="sw" style="background:${meta.color}"></i><span class="card-title">${meta.label}</span></div><div class="card-sub" style="line-height:1.55">${why}</div></div>`;
      }
      const views = sum(list, (v) => v.views);
      const med = median(list.map((v) => v.views));
      const eng = (() => { const w = list.filter((v) => v.views > 0); const tv = sum(w, (v) => v.views); return tv ? (sum(w, (v) => (v.likes || 0) + (v.comments || 0) + (v.shares || 0)) / tv) * 100 : null; })();
      const retL = list.filter((v) => isNum(v.avgViewPct) && v.views > 0);
      const ret = retL.length ? sum(retL, (v) => v.avgViewPct * v.views) / sum(retL, (v) => v.views) : null;
      const watchL = list.filter((v) => isNum(v.avgWatchSec));
      const watch = watchL.length ? median(watchL.map((v) => v.avgWatchSec)) : null;
      const fgL = list.filter((v) => isNum(v.followersGained));
      const fg = fgL.length ? sum(fgL, (v) => v.followersGained) : null;
      const per1k = isNum(fg) && views ? (fg / sum(fgL, (v) => v.views)) * 1000 : null;
      return `<div class="card plat" style="--pc:${meta.color}">
        <div class="plat-h"><i class="sw" style="background:${meta.color}"></i><span class="card-title">${meta.label}</span><span class="card-sub" style="margin-left:auto">${list.length} vídeo${list.length > 1 ? "s" : ""}</span></div>
        <div><div class="plat-big num">${fmtC(views)}</div><div class="card-sub">views · mediana ${fmt(med)} por vídeo</div></div>
        ${spark(list, meta.color)}
        <div class="plat-stats">
          <div>Retenção média<b class="num">${pct(ret, 0)}</b></div>
          <div>Tempo médio assistido<b class="num">${dur(watch)}</b></div>
          <div>Engajamento<b class="num">${pct(eng)}</b></div>
          <div>Seguidores ganhos<b class="num">${isNum(fg) ? fmt(fg) : "—"}${isNum(per1k) ? `<span class="card-sub" style="font-weight:400"> · ${fmt1(per1k)}/mil views</span>` : ""}</b></div>
        </div>
      </div>`;
    }).join("");
  }

  function renderHighlights(m) {
    const ref = m.refDate;
    const pool = m.videos.filter((v) => inPeriod(m, v.pub) && isNum(v.views));
    const el = $("#highlights");
    if (pool.length < 2) {
      el.innerHTML = `<div class="card"><div class="empty"><div><b>Poucos vídeos no período para comparar.</b><br>Troque o período para “Tudo” ou espere mais publicações.</div></div></div>`;
      return;
    }
    // Agrupa o mesmo gancho postado em várias redes
    const groups = new Map();
    for (const v of pool) {
      const g = groups.get(v.key) || { key: v.key, case: v.case, by: {}, views: 0, retW: 0, retV: 0, fg: null, first: v.pub, title: v.title, hasHook: !!v.hook };
      g.by[v.platform] = (g.by[v.platform] || 0) + v.views;
      g.views += v.views;
      if (isNum(v.avgViewPct)) { g.retW += v.avgViewPct * v.views; g.retV += v.views; }
      if (isNum(v.followersGained)) g.fg = (g.fg || 0) + v.followersGained;
      if (v.pub < g.first) g.first = v.pub;
      g.case = g.case || v.case;
      groups.set(v.key, g);
    }
    const all = [...groups.values()];
    const sorted = all.slice().sort((a, b) => b.views - a.views);
    const top = sorted.slice(0, 5);
    // Para os piores, só conta quem já teve 3 dias para rodar
    const matureKey = keyOf(addDays(ref, -3));
    const bottom = sorted.filter((g) => !top.includes(g) && g.first <= matureKey).slice(-5).reverse();
    const rankOf = (g) => sorted.indexOf(g);
    const topMax = sorted[0].views || 1;
    const bottomMax = Math.max(1, ...bottom.map((g) => g.views));
    const usedPlats = PLAT_ORDER.filter((p) => pool.some((v) => v.platform === p));
    const legend = usedPlats.length > 1 ? `<div class="legend">${usedPlats.map((p) => `<span><i class="sw" style="background:${PLAT[p].color}"></i>${PLAT[p].short}</span>`).join("")}</div>` : "";
    const anyHook = all.some((g) => g.hasHook);
    const item = (max) => (g) => {
      const parts = PLAT_ORDER.filter((p) => g.by[p]).map((p) => ({ v: g.by[p], color: PLAT[p].color, label: PLAT[p].short }));
      const meta = [g.case && `<span>${esc(g.case)}</span>`, `<span>${dShort(g.first)}</span>`, g.retV ? `<span>retenção ${pct(g.retW / g.retV, 0)}</span>` : "", isNum(g.fg) ? `<span>+${fmt(g.fg)} seguidores</span>` : ""].filter(Boolean).join("");
      return `<li><span class="n">${String(rankOf(g) + 1).padStart(2, "0")}</span><span class="hook">“${esc(g.key)}”</span><span class="hook-meta">${meta}</span><span class="bar-row">${segBar(parts, max, 78)}<span class="bar-val num">${fmtC(g.views)}</span></span></li>`;
    };
    const noun = anyHook ? "Ganchos" : "Vídeos";
    let html = `
      <div class="card"><div class="card-h"><span class="card-title">${noun} que pegaram</span><span class="card-sub">views somadas em todas as redes</span></div>${legend}<ol class="rank">${top.map(item(topMax)).join("")}</ol></div>
      <div class="card"><div class="card-h"><span class="card-title">${noun} que não pegaram</span><span class="card-sub">menos views (3+ dias no ar)</span></div>${legend}${bottom.length ? `<ol class="rank">${bottom.map(item(bottomMax)).join("")}</ol>` : `<div class="empty">Ainda não há vídeos suficientes para um “pior”.</div>`}</div>`;

    // Casos (episódios)
    const cases = new Map();
    for (const v of pool) if (v.case) { const c = cases.get(v.case) || { name: v.case, by: {}, views: 0 }; c.by[v.platform] = (c.by[v.platform] || 0) + v.views; c.views += v.views; cases.set(v.case, c); }
    const caseList = [...cases.values()].sort((a, b) => b.views - a.views).slice(0, 8);
    if (caseList.length >= 2) {
      const cmax = caseList[0].views || 1;
      html += `<div class="card"><div class="card-h"><span class="card-title">Casos</span><span class="card-sub">views somadas do episódio e dos cortes</span></div>${legend}<ol class="rank">${caseList.map((c, i) => `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><span style="font-weight:600">${esc(c.name)}</span><span class="bar-row">${segBar(PLAT_ORDER.filter((p) => c.by[p]).map((p) => ({ v: c.by[p], color: PLAT[p].color, label: PLAT[p].short })), cmax, 78)}<span class="bar-val num">${fmtC(c.views)}</span></span></li>`).join("")}</ol></div>`;
    }
    html += `<div class="card"><div class="card-h"><span class="card-title">O que os números dizem</span><span class="card-sub">gerado a partir dos vídeos do período</span></div><ul class="insights">${insights(pool).map((t) => `<li><span>${t}</span></li>`).join("") || "<li><span>Poucos dados para tirar conclusões ainda.</span></li>"}</ul></div>`;
    el.innerHTML = html;
  }

  function insights(pool) {
    const out = [];
    const byPlat = PLAT_ORDER.map((p) => ({ p, list: pool.filter((v) => v.platform === p) })).filter((x) => x.list.length >= 2);
    if (byPlat.length >= 2) {
      const ranked = byPlat.map((x) => ({ ...x, med: median(x.list.map((v) => v.views)) })).sort((a, b) => b.med - a.med);
      const a = ranked[0], b = ranked.at(-1);
      if (b.med > 0) out.push(`<b>${PLAT[a.p].label}</b> é onde cada vídeo rende mais: mediana de <b>${fmt(a.med)}</b> views, ${fmt1(a.med / b.med)}× a de ${PLAT[b.p].label} (${fmt(b.med)}).`);
      else out.push(`<b>${PLAT[a.p].label}</b> é onde cada vídeo rende mais: mediana de <b>${fmt(a.med)}</b> views por vídeo.`);
    }
    const withRet = pool.filter((v) => isNum(v.avgViewPct) && v.platform !== "yt_long");
    if (withRet.length >= 6) {
      const cut = median(withRet.map((v) => v.avgViewPct));
      const hi = median(withRet.filter((v) => v.avgViewPct >= cut).map((v) => v.views));
      const lo = median(withRet.filter((v) => v.avgViewPct < cut).map((v) => v.views));
      if (lo > 0 && hi >= lo * 1.2) out.push(`Cortes que seguram mais de <b>${pct(cut, 0)}</b> da duração têm mediana de <b>${fmt(hi)}</b> views, contra ${fmt(lo)} dos demais (${fmt1(hi / lo)}×). Os primeiros 3 segundos decidem.`);
    }
    const tk = pool.filter((v) => v.platform === "tiktok" && isNum(v.durationSec));
    if (tk.length >= 3) {
      const over = tk.filter((v) => v.durationSec > 60).length;
      out.push(over === tk.length ? `Todos os <b>${tk.length}</b> vídeos do TikTok no período passam de 1 minuto — todos contam para o Creator Rewards.` : `<b>${tk.length - over} de ${tk.length}</b> vídeos do TikTok têm 1 minuto ou menos e não contariam para o Creator Rewards.`);
    }
    const fgPlat = PLAT_ORDER.map((p) => { const l = pool.filter((v) => v.platform === p && isNum(v.followersGained) && v.views > 0); const tv = sum(l, (v) => v.views); return { p, per1k: tv >= 200 ? (sum(l, (v) => v.followersGained) / tv) * 1000 : null }; }).filter((x) => isNum(x.per1k)).sort((a, b) => b.per1k - a.per1k);
    if (fgPlat.length >= 2) out.push(`Para ganhar seguidores, <b>${PLAT[fgPlat[0].p].label}</b> converte melhor: <b>${fmt1(fgPlat[0].per1k)}</b> por mil views (${PLAT[fgPlat.at(-1).p].short}: ${fmt1(fgPlat.at(-1).per1k)}).`);
    const longs = pool.filter((v) => v.platform === "yt_long" && isNum(v.avgViewPct));
    if (longs.length >= 2) out.push(`Os vídeos longos seguram em média <b>${pct(sum(longs, (v) => v.avgViewPct) / longs.length, 0)}</b> da duração (≈ ${dur(median(longs.map((v) => v.avgWatchSec)))} por view). Cada ponto a mais acelera as 4.000 horas.`);
    return out.slice(0, 4);
  }

  function renderSpend(m) {
    const el = $("#spend");
    if (!m.spend.length) {
      el.innerHTML = `<div class="card"><div class="empty" style="margin-top:0"><div><b>Nenhum gasto lançado ainda.</b><br>Adicione uma linha por cobrança em <code>dashboard/brazil-noir/spend.json</code> — impulsionamentos (com as views e seguidores que o anúncio trouxe) e ferramentas como a voz.<br><br><code>{ "date": "2026-11-06", "category": "impulsionamento", "item": "TikTok Promote", "amount": 15, "platform": "tiktok", "results": { "views": 2900, "followers": 18 } }</code></div></div></div>`;
      return;
    }
    const list = m.spend.filter((e) => inPeriod(m, e.date)).sort((a, b) => b.date.localeCompare(a.date));
    const total = sum(list, (e) => e.amount);
    const boosts = list.filter((e) => e.category === "impulsionamento");
    const boostTotal = sum(boosts, (e) => e.amount);
    const toolTotal = sum(list.filter((e) => e.category === "ferramenta"), (e) => e.amount);
    const withRes = boosts.filter((e) => e.results);
    const paidViews = sum(withRes, (e) => e.results.views), paidFol = sum(withRes, (e) => e.results.followers), paidSpent = sum(withRes, (e) => e.amount);
    const s = startKey(m);
    const gained = NET_ORDER.map((n) => gainedBetween(m, n, s, m.refKey)).filter(isNum);
    const g = gained.length ? sum(gained, (x) => x) : null;

    // Por mês (sempre todo o histórico)
    const months = new Map();
    for (const e of m.spend) { const k = e.date.slice(0, 7); const mo = months.get(k) || {}; const c = SPEND_CAT[e.category] ? e.category : "outro"; mo[c] = (mo[c] || 0) + e.amount; months.set(k, mo); }
    const mkeys = [...months.keys()].sort().slice(-12);
    const mmax = Math.max(...mkeys.map((k) => sum(Object.values(months.get(k)), (x) => x)), 1);
    const cats = Object.keys(SPEND_CAT).filter((c) => m.spend.some((e) => (SPEND_CAT[e.category] ? e.category : "outro") === c));

    el.innerHTML = `
      <div class="spend-tiles">
        <div><div class="kpi-label">Total ${state.period ? `(${state.period} dias)` : "(tudo)"}</div><div class="v num">${brl(total)}</div></div>
        <div><div class="kpi-label">Impulsionamento</div><div class="v num">${brl(boostTotal)}</div></div>
        <div><div class="kpi-label">Ferramentas</div><div class="v num">${brl(toolTotal)}</div></div>
        <div><div class="kpi-label">Custo por mil views pagas</div><div class="v num">${paidViews ? brl((paidSpent / paidViews) * 1000) : "—"}</div></div>
        <div><div class="kpi-label">Custo por seguidor pago</div><div class="v num">${paidFol ? brl(paidSpent / paidFol) : "—"}</div></div>
        <div><div class="kpi-label">Custo por seguidor (geral)</div><div class="v num">${g > 0 && total ? brl(total / g) : "—"}</div></div>
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="card"><div class="card-h"><span class="card-title">Por mês</span><span class="card-sub">todo o histórico</span></div>
          <div class="legend">${cats.map((c) => `<span><i class="sw" style="background:${SPEND_CAT[c].color}"></i>${SPEND_CAT[c].label}</span>`).join("")}</div>
          <div class="months">${mkeys.map((k) => { const mo = months.get(k); const t = sum(Object.values(mo), (x) => x); return `<div class="month"><span>${new Date(+k.slice(0, 4), +k.slice(5) - 1, 1).toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }).replace(".", "")}</span><span class="bar-row">${segBar(cats.filter((c) => mo[c]).map((c) => ({ v: mo[c], color: SPEND_CAT[c].color, label: SPEND_CAT[c].label })), mmax, 74)}<span class="bar-val num">${brl(t, 0)}</span></span></div>`; }).join("")}</div>
        </div>
        <div class="card"><div class="card-h"><span class="card-title">Impulsionamentos</span><span class="card-sub">resultado lançado de cada anúncio</span></div>
          ${boosts.length ? `<ul class="boosts">${boosts.map((e) => { const r = e.results || {}; return `<li><span><b style="font-weight:600">${esc(e.item)}</b>${e.note ? ` <span class="muted">· ${esc(e.note)}</span>` : ""}</span><span class="amt num">${brl(e.amount)}</span><span class="res"><span>${dShort(e.date)}</span>${e.results ? `<span><b>${fmt(r.views)}</b> views</span><span><b>${fmt(r.followers)}</b> seguidores</span>${r.views ? `<span><b>${brl((e.amount / r.views) * 1000)}</b>/mil views</span>` : ""}${r.followers ? `<span><b>${brl(e.amount / r.followers)}</b>/seguidor</span>` : ""}` : `<span>sem resultado lançado</span>`}</span></li>`; }).join("")}</ul>` : `<div class="empty">Nenhum impulsionamento no período.</div>`}
        </div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-h"><span class="card-title">Todos os lançamentos</span><span class="card-sub">${list.length} no período</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Item</th><th>Categoria</th><th>Rede</th><th class="r">Valor</th></tr></thead><tbody>${list.map((e) => { const c = SPEND_CAT[e.category] ? e.category : "outro"; return `<tr><td>${dLong(e.date)}</td><td>${esc(e.item)}${e.note ? `<div class="vcase">${esc(e.note)}</div>` : ""}</td><td><span class="chip"><i class="sw" style="background:${SPEND_CAT[c].color}"></i>${SPEND_CAT[c].label}</span></td><td>${e.platform && NETS[e.platform] ? NETS[e.platform].label : "—"}</td><td class="r">${brl(e.amount)}</td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">Nada no período.</td></tr>`}</tbody></table></div>
      </div>`;
  }

  const COLS = [
    { key: "title", label: "Vídeo" },
    { key: "platform", label: "Plataforma" },
    { key: "pub", label: "Publicado", sort: true },
    { key: "durationSec", label: "Duração", r: true, sort: true },
    { key: "views", label: "Views", r: true, sort: true },
    { key: "avgViewPct", label: "Retenção", r: true, sort: true },
    { key: "likes", label: "Likes", r: true, sort: true },
    { key: "comments", label: "Coment.", r: true, sort: true },
    { key: "shares", label: "Compart.", r: true, sort: true },
    { key: "followersGained", label: "Seguid.", r: true, sort: true },
    { key: "engagement", label: "Engaj.", r: true, sort: true },
  ];

  function renderVideos(m) {
    const el = $("#videos");
    const inP = m.videos.filter((v) => inPeriod(m, v.pub));
    const present = PLAT_ORDER.filter((p) => inP.some((v) => v.platform === p));
    if (state.plat !== "all" && !present.includes(state.plat)) state.plat = "all";
    el.innerHTML = `
      <div class="filters">
        <div class="seg" role="group" aria-label="Plataforma">
          <button data-plat="all" aria-pressed="${state.plat === "all"}">Todas <span class="muted">${inP.length}</span></button>
          ${present.map((p) => `<button data-plat="${p}" aria-pressed="${state.plat === p}"><i class="sw" style="background:${PLAT[p].color};border-radius:50%;width:8px;height:8px"></i>${PLAT[p].short} <span class="muted">${inP.filter((v) => v.platform === p).length}</span></button>`).join("")}
        </div>
        <input class="search" type="search" placeholder="Buscar título, gancho ou caso" value="${esc(state.q)}" aria-label="Buscar vídeos">
      </div>
      <div class="tbl-wrap" style="max-height:620px"><table><thead><tr>${COLS.map((c) => `<th class="${c.r ? "r " : ""}${c.sort ? "sortable" : ""}" data-k="${c.key}" ${state.sort.key === c.key ? `aria-sort="${state.sort.dir < 0 ? "descending" : "ascending"}"` : ""}>${c.label}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
    const fillRows = () => {
      const q = state.q.trim().toLowerCase();
      let list = inP.filter((v) => (state.plat === "all" || v.platform === state.plat) && (!q || `${v.title} ${v.hook || ""} ${v.case || ""}`.toLowerCase().includes(q)));
      const { key, dir } = state.sort;
      list = list.slice().sort((a, b) => { const x = a[key], y = b[key]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
      el.querySelector("tbody").innerHTML = list.map((v) => {
        const meta = PLAT[v.platform] || {};
        const thumb = v.thumb ? `style="background-image:url('${esc(v.thumb)}')"` : `style="background:linear-gradient(135deg, var(--surface-3), var(--surface-2))"`;
        const title = v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title);
        const sub = [v.hook && v.hook !== v.title ? `“${esc(v.hook)}”` : "", v.case ? esc(v.case) : ""].filter(Boolean).join(" · ");
        return `<tr>
          <td><div class="vcell"><span class="thumb" ${thumb}></span><div><div class="vtitle">${title}</div>${sub ? `<div class="vcase">${sub}</div>` : ""}</div></div></td>
          <td><span class="chip"><i class="sw" style="background:${meta.color}"></i>${meta.short || v.platform}</span></td>
          <td>${v.pub ? dLong(v.pub) : "—"}</td>
          <td class="r">${dur(v.durationSec)}</td>
          <td class="r"><b>${fmt(v.views)}</b></td>
          <td class="r">${isNum(v.avgViewPct) ? `<span class="ret"><span class="ret-bar"><i style="width:${Math.min(100, v.avgViewPct)}%"></i></span>${pct(v.avgViewPct, 0)}</span>` : '<span class="muted">—</span>'}</td>
          <td class="r">${fmt(v.likes)}</td>
          <td class="r">${fmt(v.comments)}</td>
          <td class="r">${fmt(v.shares)}</td>
          <td class="r">${fmt(v.followersGained)}</td>
          <td class="r">${pct(v.engagement)}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="${COLS.length}" class="muted" style="padding:28px;text-align:center">Nenhum vídeo ${state.period ? `publicado nos últimos ${state.period} dias` : ""}${q ? " com essa busca" : ""}.</td></tr>`;
      $("#videos-aside").textContent = `${list.length} de ${m.videos.length} vídeos`;
    };
    fillRows();
    el.querySelectorAll("[data-plat]").forEach((b) => b.addEventListener("click", () => { state.plat = b.dataset.plat; renderVideos(m); }));
    el.querySelector(".search").addEventListener("input", (e) => { state.q = e.target.value; fillRows(); });
    el.querySelectorAll("th.sortable").forEach((th) => th.addEventListener("click", () => {
      const k = th.dataset.k;
      state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: -1 };
      renderVideos(m);
      const s = el.querySelector(".search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); s.blur();
    }));
  }

  function renderSources(m) {
    const yt = m.sources.youtube || (m.live ? "api" : null);
    const ana = String(m.sources.youtube || "").includes("analytics");
    const sample = m.mode === "sample";
    const row = (state, name, what, how) => `<div class="source"><span class="dot ${state}"></span><div class="source-name">${name}<small>${what}</small></div><div class="source-how">${how}</div></div>`;
    $("#sources").innerHTML = [
      row(yt || sample ? "on" : "off", "YouTube · dados públicos", "inscritos, views, likes, comentários, todos os uploads",
        yt ? `Ligado. <code>YOUTUBE_API_KEY</code> no coletor${m.live ? " e atualização ao vivo nesta página" : "; ao vivo só no domínio da Vercel (a chave é restrita por referrer)"}.` : "Defina <code>YOUTUBE_API_KEY</code> (a mesma da v1) e rode o coletor."),
      row(ana || sample ? "on" : "off", "YouTube Analytics", "retenção, tempo assistido, horas de exibição, inscritos por vídeo, views por dia",
        ana ? "Ligado." : "Precisa de OAuth da conta do Brazil Noir com o escopo <code>yt-analytics.readonly</code>. Gere um refresh token novo (o de upload não tem esse escopo) e salve em <code>BN_YOUTUBE_CLIENT_ID</code>, <code>BN_YOUTUBE_CLIENT_SECRET</code> e <code>BN_YOUTUBE_REFRESH_TOKEN</code>. Sem isso, horas e Shorts em 90 dias ficam estimados."),
      row(m.sources.tiktok || sample ? "on" : m.manualUsed.tiktok ? "part" : "off", "TikTok", "seguidores, views, likes, comentários e compartilhamentos por vídeo",
        m.sources.tiktok ? "Ligado pela Display API." : `A Display API precisa dos escopos <code>user.info.stats</code> e <code>video.list</code> aprovados no app do TikTok, e do token da conta em <code>BN_TIKTOK_ACCESS_TOKEN</code>/<code>BN_TIKTOK_REFRESH_TOKEN</code>. Retenção e seguidores por vídeo não saem pela API: copie do TikTok Studio para <code>manual.json</code>.${m.manualUsed.tiktok ? " Hoje: lançamento manual." : ""}`),
      row(m.sources.instagram || sample ? "on" : m.manualUsed.instagram ? "part" : "off", "Instagram Reels", "seguidores, views, likes, compartilhamentos e tempo médio por Reel",
        m.sources.instagram ? "Ligado pela Graph API." : "Conta profissional do Instagram ligada a uma página do Facebook + app da Meta com <code>instagram_basic</code> e <code>instagram_manage_insights</code>. Salve <code>BN_IG_USER_ID</code> e <code>BN_IG_ACCESS_TOKEN</code> (token de longa duração)."),
      row(m.spend.length || sample ? "on" : "off", "Gastos", "impulsionamentos e ferramentas",
        `Lançamento manual em <code>spend.json</code> (o TikTok Promote não tem API pública de relatório). ${m.spend.length} lançamento${m.spend.length === 1 ? "" : "s"}.`),
      row(m.mode === "sample" ? "on" : m.daily.length > 7 ? "on" : "part", "Histórico diário", "curvas de seguidores e views por dia",
        `Cada execução de <code>node pipeline/brazil-noir/analytics.js</code> grava um ponto do dia. Agende 1×/dia (junto do <code>run-analytics.sh</code>) para formar as curvas. Hoje: ${new Set(m.daily.map((r) => r.date)).size} dia${new Set(m.daily.map((r) => r.date)).size === 1 ? "" : "s"} registrado${new Set(m.daily.map((r) => r.date)).size === 1 ? "" : "s"}.`),
    ].join("");
  }

  // ---------- Eventos ----------
  async function setMode(mode) {
    state.mode = mode;
    store.set("bn-mode", mode);
    $("#main").innerHTML = `<div class="loading">Abrindo o arquivo do caso…</div>`;
    state.model = await loadModel(mode);
    render();
    if (state.model && mode === "real" && (await liveYouTube(state.model)) && state.mode === "real") render();
  }
  document.querySelectorAll("#mode-seg button").forEach((b) => b.addEventListener("click", () => b.dataset.mode !== state.mode && setMode(b.dataset.mode)));
  document.querySelectorAll("#period-seg button").forEach((b) => b.addEventListener("click", () => { state.period = +b.dataset.period; store.set("bn-period", String(state.period)); render(); }));
  $("#theme-btn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("bn-theme", next);
  });
  // Redesenha os gráficos quando a largura muda
  let lastW = 0, rT;
  new ResizeObserver(() => { const w = $("#main").clientWidth; if (Math.abs(w - lastW) < 4) return; lastW = w; clearTimeout(rT); rT = setTimeout(() => state.model && renderGrowth(state.model), 120); }).observe($("#main"));

  setMode(state.mode);
})();
</script>
</body>
</html>
