      const ret = retL.length ? sum(retL, (v) => v.avgViewPct * v.views) / sum(retL, (v) => v.views) : null;
      const watchL = list.filter((v) => isNum(v.avgWatchSec));
      const fgL = list.filter((v) => isNum(v.followersGained));
      const fg = fgL.length ? sum(fgL, (v) => v.followersGained) : null;
      const per1k = isNum(fg) && sum(fgL, (v) => v.views) ? (fg / sum(fgL, (v) => v.views)) * 1000 : null;
      return `<div class="card plat">${head}
        <div><div class="plat-big num">${fmtC(views)}</div><div class="card-sub">views · mediana ${fmt(median(list.map((v) => v.views)))} por vídeo</div></div>
        ${spark(list, meta.color)}
        <div class="plat-stats">
          <div>Retenção média<b class="num">${pct(ret, 0)}</b></div>
          <div>Tempo assistido<b class="num">${watchL.length ? dur(median(watchL.map((v) => v.avgWatchSec))) : "—"}</b></div>
          <div>Engajamento<b class="num">${pct(eng)}</b></div>
          <div>Seguidores<b class="num">${isNum(fg) ? "+" + fmt(fg) : "—"}${isNum(per1k) ? ` <span class="card-sub" style="font-weight:400">${fmt1(per1k)}/mil views</span>` : ""}</b></div>
        </div></div>`;
    }).join("");
  }

  function renderHighlights(m) {
    const pool = m.videos.filter((v) => inPeriod(m, v.pub) && isNum(v.views));
    const el = $("#hl");
    if (pool.length < 2) { el.innerHTML = `<div class="card" style="grid-column:1/-1">${empty("<b>Poucos vídeos no período para comparar.</b><br>Troque o período para “Tudo”.")}</div>`; return; }
    const groups = new Map();
    for (const v of pool) {
      const g = groups.get(v.key) || { key: v.key, case: v.case, by: {}, views: 0, retW: 0, retV: 0, fg: null, first: v.pub, hasHook: !!v.hook };
      g.by[v.platform] = (g.by[v.platform] || 0) + v.views;
      g.views += v.views;
      if (isNum(v.avgViewPct)) { g.retW += v.avgViewPct * v.views; g.retV += v.views; }
      if (isNum(v.followersGained)) g.fg = (g.fg || 0) + v.followersGained;
      if (v.pub < g.first) g.first = v.pub;
      g.case = g.case || v.case;
      groups.set(v.key, g);
    }
    const sorted = [...groups.values()].sort((a, b) => b.views - a.views);
    const top = sorted.slice(0, 5);
    const matureKey = keyOf(addDays(m.refDate, -3));
    const bottom = sorted.filter((g) => !top.includes(g) && g.first <= matureKey).slice(-5).reverse();
    const used = PLAT_ORDER.filter((p) => pool.some((v) => v.platform === p));
    const legend = used.length > 1 ? `<div class="legend">${used.map((p) => `<span><i class="sw" style="background:${PLAT[p].color}"></i>${PLAT[p].short}</span>`).join("")}</div>` : "";
    const anyHook = sorted.some((g) => g.hasHook);
    const item = (max) => (g) => {
      const parts = PLAT_ORDER.filter((p) => g.by[p]).map((p) => ({ v: g.by[p], color: PLAT[p].color, label: PLAT[p].short }));
      const meta = [g.case && `<span>${esc(g.case)}</span>`, `<span>${dShort(g.first)}</span>`, g.retV ? `<span>retenção ${pct(g.retW / g.retV, 0)}</span>` : "", isNum(g.fg) ? `<span>+${fmt(g.fg)} seguidores</span>` : ""].filter(Boolean).join("");
      return `<li><span class="n">${sorted.indexOf(g) + 1}</span><span class="t">${anyHook ? `“${esc(g.key)}”` : esc(g.key)}</span><span class="m">${meta}</span><span class="bar-row">${segBar(parts, max, 78)}<span class="bar-val num">${fmtC(g.views)}</span></span></li>`;
    };
    const noun = anyHook ? "Ganchos" : "Vídeos";
    let html = `
      <div class="card"><div class="card-h"><span class="card-title">${noun} com mais views</span><span class="card-sub">somando todas as redes</span></div>${legend}<ol class="rank">${top.map(item(sorted[0].views || 1)).join("")}</ol></div>
      <div class="card"><div class="card-h"><span class="card-title">${noun} com menos views</span><span class="card-sub">com 3+ dias no ar</span></div>${legend}${bottom.length ? `<ol class="rank">${bottom.map(item(Math.max(1, ...bottom.map((g) => g.views)))).join("")}</ol>` : empty("Ainda não há vídeos suficientes.")}</div>`;
    const cases = new Map();
    for (const v of pool) if (v.case) { const c = cases.get(v.case) || { name: v.case, by: {}, views: 0 }; c.by[v.platform] = (c.by[v.platform] || 0) + v.views; c.views += v.views; cases.set(v.case, c); }
    const caseList = [...cases.values()].sort((a, b) => b.views - a.views).slice(0, 8);
    if (caseList.length >= 2) {
      html += `<div class="card"><div class="card-h"><span class="card-title">Casos</span><span class="card-sub">episódio + cortes</span></div>${legend}<ol class="rank">${caseList.map((c, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(c.name)}</span><span class="bar-row">${segBar(PLAT_ORDER.filter((p) => c.by[p]).map((p) => ({ v: c.by[p], color: PLAT[p].color, label: PLAT[p].short })), caseList[0].views || 1, 78)}<span class="bar-val num">${fmtC(c.views)}</span></span></li>`).join("")}</ol></div>`;
    }
    const ins = insights(pool);
    html += `<div class="card"><div class="card-h"><span class="card-title">Leituras do período</span></div>${ins.length ? `<ul class="insights">${ins.map((t) => `<li>${t}</li>`).join("")}</ul>` : empty("Poucos dados para tirar conclusões ainda.")}</div>`;
    el.innerHTML = html;
  }

  function insights(pool) {
    const out = [];
    const byPlat = PLAT_ORDER.map((p) => ({ p, list: pool.filter((v) => v.platform === p) })).filter((x) => x.list.length >= 2);
    if (byPlat.length >= 2) {
      const r = byPlat.map((x) => ({ ...x, med: median(x.list.map((v) => v.views)) })).sort((a, b) => b.med - a.med);
      const a = r[0], b = r.at(-1);
      out.push(b.med > 0 ? `<b>${PLAT[a.p].label}</b> rende mais por vídeo: mediana de <b>${fmt(a.med)}</b> views, ${fmt1(a.med / b.med)}× a de ${PLAT[b.p].label} (${fmt(b.med)}).` : `<b>${PLAT[a.p].label}</b> rende mais por vídeo: mediana de <b>${fmt(a.med)}</b> views.`);
    }
    const withRet = pool.filter((v) => isNum(v.avgViewPct) && v.platform !== "yt_long");
    if (withRet.length >= 6) {
      const cut = median(withRet.map((v) => v.avgViewPct));
      const hi = median(withRet.filter((v) => v.avgViewPct >= cut).map((v) => v.views));
      const lo = median(withRet.filter((v) => v.avgViewPct < cut).map((v) => v.views));
      if (lo > 0 && hi >= lo * 1.2) out.push(`Cortes que seguram mais de <b>${pct(cut, 0)}</b> da duração têm mediana de <b>${fmt(hi)}</b> views, contra ${fmt(lo)} dos demais (${fmt1(hi / lo)}×).`);
    }
    const tk = pool.filter((v) => v.platform === "tiktok" && isNum(v.durationSec));
    if (tk.length >= 3) { const over = tk.filter((v) => v.durationSec > 60).length; out.push(over === tk.length ? `Todos os <b>${tk.length}</b> vídeos do TikTok no período passam de 1 minuto e contam para o Creator Rewards.` : `<b>${tk.length - over} de ${tk.length}</b> vídeos do TikTok têm 1 minuto ou menos e não contam para o Creator Rewards.`); }
    const fgPlat = PLAT_ORDER.map((p) => { const l = pool.filter((v) => v.platform === p && isNum(v.followersGained) && v.views > 0); const tv = sum(l, (v) => v.views); return { p, per1k: tv >= 200 ? (sum(l, (v) => v.followersGained) / tv) * 1000 : null }; }).filter((x) => isNum(x.per1k)).sort((a, b) => b.per1k - a.per1k);
    if (fgPlat.length >= 2) out.push(`<b>${PLAT[fgPlat[0].p].label}</b> converte mais views em seguidores: <b>${fmt1(fgPlat[0].per1k)}</b> por mil views (${PLAT[fgPlat.at(-1).p].short}: ${fmt1(fgPlat.at(-1).per1k)}).`);
    const longs = pool.filter((v) => v.platform === "yt_long" && isNum(v.avgViewPct));
    if (longs.length >= 2) out.push(`Os vídeos longos seguram em média <b>${pct(sum(longs, (v) => v.avgViewPct) / longs.length, 0)}</b> da duração (≈ ${dur(median(longs.map((v) => v.avgWatchSec)))} por view).`);
    return out.slice(0, 4);
  }

  const COLS = [
    { key: "title", label: "Vídeo" },
    { key: "platform", label: "Plataforma" },
    { key: "pub", label: "Publicado", sort: true },
    { key: "views", label: "Views", r: true, sort: true },
    { key: "avgViewPct", label: "Retenção", r: true, sort: true },
    { key: "likes", label: "Likes", r: true, sort: true },
    { key: "comments", label: "Coment.", r: true, sort: true },
    { key: "shares", label: "Compart.", r: true, sort: true },
    { key: "followersGained", label: "Seguidores", r: true, sort: true },
    { key: "engagement", label: "Engaj.", r: true, sort: true },
  ];
  function renderVideos(m) {
    const el = $("#vtable");
    const inP = m.videos.filter((v) => inPeriod(m, v.pub));
    const present = PLAT_ORDER.filter((p) => inP.some((v) => v.platform === p));
    if (state.plat !== "all" && !present.includes(state.plat)) state.plat = "all";
    el.innerHTML = `
      <div class="filters">
        <div class="seg" role="group" aria-label="Plataforma">
          <button data-plat="all" aria-pressed="${state.plat === "all"}">Todas <span class="muted">${inP.length}</span></button>
          ${present.map((p) => `<button data-plat="${p}" aria-pressed="${state.plat === p}"><i class="sw" style="background:${PLAT[p].color};border-radius:50%;width:8px;height:8px"></i>${PLAT[p].short} <span class="muted">${inP.filter((v) => v.platform === p).length}</span></button>`).join("")}
        </div>
        <input class="search" type="search" placeholder="Buscar título, gancho ou caso" value="${esc(state.q)}" aria-label="Buscar vídeos">
      </div>
      <div class="tbl-wrap" style="max-height:640px"><table><thead><tr>${COLS.map((c) => `<th class="${c.r ? "r " : ""}${c.sort ? "sortable" : ""}" data-k="${c.key}" ${state.sort.key === c.key ? `aria-sort="${state.sort.dir < 0 ? "descending" : "ascending"}"` : ""}>${c.label}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
    const fill = () => {
      const q = state.q.trim().toLowerCase();
      let list = inP.filter((v) => (state.plat === "all" || v.platform === state.plat) && (!q || `${v.title} ${v.hook || ""} ${v.case || ""}`.toLowerCase().includes(q)));
      const { key, dir } = state.sort;
      list = list.slice().sort((a, b) => { const x = a[key], y = b[key]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
      el.querySelector("tbody").innerHTML = list.map((v) => {
        const meta = PLAT[v.platform] || {};
        const sub = [v.hook && v.hook !== v.title ? `“${esc(v.hook)}”` : "", v.case ? esc(v.case) : ""].filter(Boolean).join(" · ");
        return `<tr>
          <td><div class="vcell">${thumb(v)}<div style="min-width:0"><div class="vtitle">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title)}</div>${sub ? `<div class="vcase">${sub}</div>` : ""}</div></div></td>
          <td><span class="chip"><i class="sw" style="background:${meta.color}"></i>${meta.short || v.platform}</span></td>
          <td>${v.pub ? dLong(v.pub) : "—"}</td>
          <td class="r"><b>${fmt(v.views)}</b></td>
          <td class="r">${isNum(v.avgViewPct) ? `<span class="ret"><span class="ret-bar"><i style="width:${Math.min(100, v.avgViewPct)}%"></i></span>${pct(v.avgViewPct, 0)}</span>` : '<span class="muted">—</span>'}</td>
          <td class="r">${fmt(v.likes)}</td><td class="r">${fmt(v.comments)}</td><td class="r">${fmt(v.shares)}</td>
          <td class="r">${isNum(v.followersGained) ? "+" + fmt(v.followersGained) : "—"}</td>
          <td class="r">${pct(v.engagement)}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="${COLS.length}" class="muted" style="padding:28px;text-align:center">Nenhum vídeo ${state.period ? `publicado nos últimos ${state.period} dias` : ""}${q ? " com essa busca" : ""}.</td></tr>`;
      $("#videos-aside").textContent = `${list.length} de ${m.videos.length} vídeos`;
    };
    fill();
    el.querySelectorAll("[data-plat]").forEach((b) => b.addEventListener("click", () => { state.plat = b.dataset.plat; renderVideos(m); }));
    el.querySelector(".search").addEventListener("input", (e) => { state.q = e.target.value; fill(); });
    el.querySelectorAll("th.sortable").forEach((th) => th.addEventListener("click", () => { const k = th.dataset.k; state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: -1 }; renderVideos(m); }));
  }

  // ---------- Lançamento de gastos ----------
  const editable = (m) => m.mode === "real" && state.api;
  function toast(text) {
    const t = $("#toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove("show"), 2600);
  }
  async function refresh() {
    const y = scrollY;
    const mdl = await loadModel(state.mode);
    state.model = mdl;
    render();
    scrollTo(0, y);
    if (mdl && state.mode === "real" && (await liveYouTube(mdl)) && state.model === mdl) liveRender();
  }
  function spendHeader(m) {
    const sample = m.mode === "sample";
    $("#spend-btn").innerHTML = `<button class="btn primary" id="new-spend" type="button" ${sample ? 'disabled title="Troque para Dados reais para lançar"' : ""}>${ICON.plus}Novo gasto</button>`;
    $("#new-spend")?.addEventListener("click", () => openSpendForm(m, null));
  }
  function openSpendForm(m, entry) {
    const box = $("#spend-form");
    if (!state.api) {
      box.innerHTML = `<div class="notice"><span class="tag">Só leitura</span><span>Esta página está sem o servidor local, então não consegue gravar. Abra a dashboard pelo atalho <b>Brazil Noir - Dashboard</b> da área de trabalho para lançar por aqui (ou edite <code>dashboard/brazil-noir/spend.json</code>).</span></div>`;
      box.scrollIntoView({ block: "nearest" });
      return;
    }
    const e = entry || { date: keyOf(new Date()), category: "impulsionamento", platform: "tiktok", item: "", amount: "" };
    const items = [...new Set(["TikTok Promote", "ElevenLabs", ...m.spend.map((x) => x.item)])];
    const vids = m.videos.slice(0, 40);
    const opt = (val, label, cur) => `<option value="${esc(val)}" ${String(cur ?? "") === String(val) ? "selected" : ""}>${esc(label)}</option>`;
    const r = e.results || {};
    box.innerHTML = `<div class="card form-card">
      <div class="card-h"><span class="card-title">${entry ? "Editar gasto" : "Novo gasto"}</span><span class="card-sub">grava em <code>spend.json</code></span></div>
      <form class="form" id="spend-f" novalidate autocomplete="off">
        <div class="field"><label for="f-date">Data</label><input id="f-date" name="date" type="date" required value="${esc(e.date)}"></div>
        <div class="field"><label for="f-cat">Categoria</label><select id="f-cat" name="category">${Object.entries(SPEND_CAT).map(([k, c]) => opt(k, c.label, e.category)).join("")}</select></div>
        <div class="field w2"><label for="f-item">Item</label><input id="f-item" name="item" list="f-items" required maxlength="120" placeholder="ex.: TikTok Promote, ElevenLabs" value="${esc(e.item)}"><datalist id="f-items">${items.map((i) => `<option value="${esc(i)}">`).join("")}</datalist></div>
        <div class="field"><label for="f-amount">Valor (R$)</label><input id="f-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0,00" value="${esc(e.amount)}"></div>
        <div class="field"><label for="f-plat">Rede</label><select id="f-plat" name="platform">${opt("", "—", e.platform)}${NET_ORDER.map((n) => opt(n, NETS[n].label, e.platform)).join("")}</select></div>
        <div class="field w2"><label for="f-note">Observação</label><input id="f-note" name="note" maxlength="200" placeholder="opcional" value="${esc(e.note || "")}"></div>
        <div class="boost-only" ${e.category === "impulsionamento" ? "" : "hidden"}>
          <div class="field w2"><label for="f-video">Vídeo impulsionado</label><select id="f-video" name="videoId">${opt("", "— não informar —", e.videoId)}${vids.map((v) => opt(v.id, `${PLAT[v.platform].short} · ${v.title.slice(0, 60)}`, e.videoId)).join("")}</select></div>
          <div class="field"><label for="f-views">Views obtidas</label><input id="f-views" name="views" type="number" min="0" step="1" placeholder="—" value="${esc(r.views ?? "")}"><span class="hint">do painel do anúncio</span></div>
          <div class="field"><label for="f-fol">Seguidores obtidos</label><input id="f-fol" name="followers" type="number" min="0" step="1" placeholder="—" value="${esc(r.followers ?? "")}"><span class="hint">pode preencher depois</span></div>
        </div>
        <div class="form-actions"><span class="msg" id="f-msg"></span><button type="button" class="btn" id="f-cancel">Cancelar</button><button type="submit" class="btn primary" id="f-save">${entry ? "Salvar alterações" : "Lançar gasto"}</button></div>
      </form></div>`;
    const f = $("#spend-f");
    f.category.addEventListener("change", () => { f.querySelector(".boost-only").hidden = f.category.value !== "impulsionamento"; });
    $("#f-cancel").addEventListener("click", () => { box.innerHTML = ""; flushRender(); });
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const msg = $("#f-msg");
      const amount = Number(String(f.amount.value).replace(",", "."));
      if (!f.date.value || !f.item.value.trim() || !(amount > 0)) { msg.className = "msg err"; msg.textContent = "Preencha data, item e um valor maior que zero."; return; }
      const body = {
        date: f.date.value, category: f.category.value, item: f.item.value.trim(), amount, platform: f.platform.value || null, note: f.note.value.trim() || null,
        ...(f.category.value === "impulsionamento" && {
          videoId: f.videoId.value || null,
          results: { views: f.views.value === "" ? null : Number(f.views.value), followers: f.followers.value === "" ? null : Number(f.followers.value) },
        }),
      };
      $("#f-save").disabled = true;
      msg.className = "msg"; msg.textContent = "Salvando…";
      try {
        const res = await fetch(`/api/brazil-noir/spend${entry ? "/" + encodeURIComponent(entry.id) : ""}`, { method: entry ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || `erro ${res.status}`);
        await refresh();
        toast(entry ? "Gasto atualizado" : `Gasto lançado: ${body.item} · ${brl(amount)}`);
      } catch (err) {
        $("#f-save").disabled = false;
        msg.className = "msg err"; msg.textContent = `Não salvou: ${err.message}`;
      }
    });
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    (entry ? f.amount : f.item).focus({ preventScroll: true });
  }
  async function deleteSpend(e) {
    if (!confirm(`Excluir o gasto "${e.item}" de ${dLong(e.date)} (${brl(e.amount)})?`)) return;
    const res = await fetch(`/api/brazil-noir/spend/${encodeURIComponent(e.id)}`, { method: "DELETE", headers: { "Content-Type": "application/json" } });
    if (!res.ok) { toast("Não consegui excluir"); return; }
    await refresh();
    toast("Gasto excluído");
  }
  function wireSpendRows(m) {
    document.querySelectorAll("[data-edit-spend]").forEach((b) => b.addEventListener("click", () => openSpendForm(m, m.spend.find((x) => x.id === b.dataset.editSpend))));
    document.querySelectorAll("[data-del-spend]").forEach((b) => b.addEventListener("click", () => deleteSpend(m.spend.find((x) => x.id === b.dataset.delSpend))));
  }

  function renderSpend(m) {
    const el = $("#spendbox");
    spendHeader(m);
    if (!m.spend.length) {
      el.innerHTML = `<div class="card">${empty(`<b>Nenhum gasto lançado ainda.</b><br>Clique em <b>Novo gasto</b> para lançar impulsionamentos (com as views e seguidores que o anúncio trouxe) e ferramentas, como a voz.${state.api ? "" : "<br>Para gravar pela página, abra pelo atalho da área de trabalho."}`).replace('class="empty"', 'class="empty" style="margin-top:0"')}</div>`;
      return;
    }
    const list = m.spend.filter((e) => inPeriod(m, e.date)).sort((a, b) => b.date.localeCompare(a.date));
    const total = sum(list, (e) => e.amount);
    const boosts = list.filter((e) => e.category === "impulsionamento");
    const withRes = boosts.filter((e) => e.results);
    const paidViews = sum(withRes, (e) => e.results.views), paidFol = sum(withRes, (e) => e.results.followers), paidSpent = sum(withRes, (e) => e.amount);
    const g = NET_ORDER.map((n) => gainedBetween(m, n, startKey(m), m.refKey)).filter(isNum);
    const gained = g.length ? sum(g, (x) => x) : null;
    const months = new Map();
    for (const e of m.spend) { const k = e.date.slice(0, 7); const mo = months.get(k) || {}; const c = SPEND_CAT[e.category] ? e.category : "outro"; mo[c] = (mo[c] || 0) + e.amount; months.set(k, mo); }
    const mkeys = [...months.keys()].sort().slice(-12);
    const mmax = Math.max(...mkeys.map((k) => sum(Object.values(months.get(k)), (x) => x)), 1);
    const cats = Object.keys(SPEND_CAT).filter((c) => m.spend.some((e) => (SPEND_CAT[e.category] ? e.category : "outro") === c));
    const tile = (l, v) => `<div><div class="kpi-label">${l}</div><div class="v num">${v}</div></div>`;
    el.innerHTML = `
      <div class="spend-tiles">
        ${tile(state.period ? `Total (${state.period} dias)` : "Total", brl(total))}
        ${tile("Impulsionamento", brl(sum(boosts, (e) => e.amount)))}
        ${tile("Ferramentas", brl(sum(list.filter((e) => e.category === "ferramenta"), (e) => e.amount)))}
        ${tile("Custo por mil views pagas", paidViews ? brl((paidSpent / paidViews) * 1000) : "—")}
        ${tile("Custo por seguidor pago", paidFol ? brl(paidSpent / paidFol) : "—")}
        ${tile("Custo por seguidor (geral)", gained > 0 && total ? brl(total / gained) : "—")}
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="card"><div class="card-h"><span class="card-title">Por mês</span><span class="card-sub">todo o histórico</span></div>
          <div class="legend">${cats.map((c) => `<span><i class="sw" style="background:${SPEND_CAT[c].color}"></i>${SPEND_CAT[c].label}</span>`).join("")}</div>
          <div class="months">${mkeys.map((k) => { const mo = months.get(k); return `<div class="month"><span>${new Date(+k.slice(0, 4), +k.slice(5) - 1, 1).toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }).replace(/\./g, "").replace(/ de /g, " ")}</span><span class="bar-row">${segBar(cats.filter((c) => mo[c]).map((c) => ({ v: mo[c], color: SPEND_CAT[c].color, label: SPEND_CAT[c].label })), mmax, 74)}<span class="bar-val num">${brl(sum(Object.values(mo), (x) => x), 0)}</span></span></div>`; }).join("")}</div>
        </div>
        <div class="card"><div class="card-h"><span class="card-title">Impulsionamentos</span><span class="card-sub">resultado de cada anúncio</span></div>
          ${boosts.length ? `<ul class="boosts">${boosts.map((e) => { const r = e.results || {}; return `<li><span><b style="font-weight:600">${esc(e.item)}</b>${e.note ? ` <span class="muted">· ${esc(e.note)}</span>` : ""}</span><span class="amt num">${brl(e.amount)}</span><span class="res"><span>${dShort(e.date)}</span>${e.results ? `<span><b>${fmt(r.views)}</b> views</span><span><b>${fmt(r.followers)}</b> seguidores</span>${r.views ? `<span><b>${brl((e.amount / r.views) * 1000)}</b>/mil views</span>` : ""}${r.followers ? `<span><b>${brl(e.amount / r.followers)}</b>/seguidor</span>` : ""}` : `<span>sem resultado lançado</span>${editable(m) && e.id ? `<button type="button" class="link" style="background:none;border:0;padding:0;cursor:pointer;text-decoration:underline" data-edit-spend="${esc(e.id)}">lançar resultado</button>` : ""}`}</span></li>`; }).join("")}</ul>` : empty("Nenhum impulsionamento no período.")}
        </div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-h"><span class="card-title">Lançamentos</span><span class="card-sub">${list.length} no período</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Item</th><th>Categoria</th><th>Rede</th><th class="r">Valor</th>${editable(m) ? '<th class="r" aria-label="Ações"></th>' : ""}</tr></thead><tbody>${list.map((e) => { const c = SPEND_CAT[e.category] ? e.category : "outro"; return `<tr><td>${dLong(e.date)}</td><td>${esc(e.item)}${e.note ? `<div class="vcase">${esc(e.note)}</div>` : ""}</td><td><span class="chip"><i class="sw" style="background:${SPEND_CAT[c].color}"></i>${SPEND_CAT[c].label}</span></td><td>${e.platform && NETS[e.platform] ? NETS[e.platform].label : "—"}</td><td class="r">${brl(e.amount)}</td>${editable(m) ? `<td class="r"><span class="row-act">${e.id ? `<button type="button" title="Editar" aria-label="Editar" data-edit-spend="${esc(e.id)}">${ICON.edit}</button><button type="button" class="del" title="Excluir" aria-label="Excluir" data-del-spend="${esc(e.id)}">${ICON.del}</button>` : ""}</span></td>` : ""}</tr>`; }).join("") || `<tr><td colspan="${editable(m) ? 6 : 5}" class="muted">Nada no período.</td></tr>`}</tbody></table></div>
      </div>`;
    wireSpendRows(m);
  }

  function renderSources(m) {
    const f = sourceFlags(m);
    const days = new Set(m.daily.map((r) => r.date)).size;
    const row = (s, name, what, how) => `<div class="source"><span class="dot ${s}"></span><div class="source-name">${name}<small>${what}</small></div><div class="source-how">${how}</div></div>`;
    $("#srcs").innerHTML = [
      row(f.yt ? "on" : "off", "YouTube · dados públicos", "inscritos, views, likes, comentários, uploads", f.yt ? `Ligado pela <code>YOUTUBE_API_KEY</code>${m.live ? ", com atualização ao vivo nesta página" : ". Ao vivo só no domínio da Vercel (a chave é restrita por referrer)"}.` : "Defina <code>YOUTUBE_API_KEY</code> e rode o coletor."),
      row(f.ana ? "on" : "off", "YouTube Analytics e agendados", "retenção, tempo assistido, horas de exibição, inscritos por vídeo, vídeos agendados no Studio", f.ana ? "Ligado." : "Precisa de OAuth da conta do Brazil Noir com os escopos <code>yt-analytics.readonly</code> e <code>youtube.readonly</code> (o token de upload não tem). Salve em <code>BN_YOUTUBE_CLIENT_ID</code>, <code>BN_YOUTUBE_CLIENT_SECRET</code> e <code>BN_YOUTUBE_REFRESH_TOKEN</code>."),
      row(f.tk, "TikTok", "seguidores e métricas por vídeo", m.sources.tiktok ? "Ligado pela Display API." : `Precisa dos escopos <code>user.info.stats</code> e <code>video.list</code> aprovados no app do TikTok e do token em <code>BN_TIKTOK_ACCESS_TOKEN</code>/<code>BN_TIKTOK_REFRESH_TOKEN</code>. Retenção e seguidores por vídeo: copie do TikTok Studio para <code>manual.json</code>.${f.tk === "part" ? " Hoje: lançamento manual." : ""}`),
      row(f.ig, "Instagram Reels", "seguidores e métricas por Reel", m.sources.instagram ? "Ligado pela Graph API." : "Conta profissional ligada a uma página do Facebook + app da Meta com <code>instagram_basic</code> e <code>instagram_manage_insights</code>. Salve <code>BN_IG_USER_ID</code> e <code>BN_IG_ACCESS_TOKEN</code>."),
      row(m.spend.length || m.mode === "sample" ? "on" : "off", "Gastos", "impulsionamentos e ferramentas", `Lançamento manual em <code>spend.json</code> (o TikTok Promote não tem API pública de relatório). ${m.spend.length} lançamento${m.spend.length === 1 ? "" : "s"}.`),
      row(m.mode === "sample" || days > 7 ? "on" : "part", "Histórico diário", "curvas de seguidores e views", `Cada <code>npm run bn:dashboard</code> grava um ponto do dia. Rode 1×/dia para formar as curvas. Hoje: ${days} dia${days === 1 ? "" : "s"}.`),
    ].join("");
  }

  // ---------- Navegação lateral: destaca a seção visível ----------
  let spyObs;
  function spy() {
    spyObs?.disconnect();
    const links = [...document.querySelectorAll("#nav a")];
    const setActive = (id) => links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + id));
    spyObs = new IntersectionObserver((entries) => {
      const vis = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) setActive(vis[0].target.id);
    }, { rootMargin: "-80px 0px -60% 0px" });
    links.forEach((a) => { const s = document.querySelector(a.getAttribute("href")); if (s) spyObs.observe(s); });
  }

  // Atualização ao vivo não redesenha a tela com um formulário aberto (perderia o que foi digitado)
  function liveRender() {
    if (document.querySelector("#spend-f, #sched-f")) { state.pendingRender = true; return; }
    const y = scrollY;
    render();
    scrollTo(0, y);
  }
  function flushRender() { if (state.pendingRender) { state.pendingRender = false; liveRender(); } }

  // ---------- Eventos ----------
  async function setMode(mode) {
    state.mode = mode;
    store.set("bn-mode", mode);
    $("#main").innerHTML = `<div class="loading">Carregando…</div>`;
    state.model = await loadModel(mode);
    render();
    if (state.model && mode === "real" && (await liveYouTube(state.model)) && state.mode === "real") liveRender();
  }
  document.querySelectorAll("#mode-seg button").forEach((b) => b.addEventListener("click", () => b.dataset.mode !== state.mode && setMode(b.dataset.mode)));
  document.querySelectorAll("#period-seg button").forEach((b) => b.addEventListener("click", () => { state.period = +b.dataset.period; store.set("bn-period", String(state.period)); render(); }));
  $("#theme-btn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("bn-theme", next);
  });
  let lastW = 0, rT;
  new ResizeObserver(() => { const w = $("#main").clientWidth; if (Math.abs(w - lastW) < 4) return; lastW = w; clearTimeout(rT); rT = setTimeout(() => state.model && $("#ch-followers") && renderGrowth(state.model), 120); }).observe($("#main"));

  // Na Vercel a dashboard tem login; no servidor local (127.0.0.1) não
  if (!/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) $("#logout").hidden = false;

  setMode(state.mode);
})();
</script>
</body>
</html>
