<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codex Mental — Painel do Pipeline</title>
<style>
  :root {
    --bg: #0c0a14;
    --card: #16121f;
    --border: #2a2440;
    --purple: #9b6dff;
    --purple-glow: #b794ff;
    --text: #e8e4f5;
    --muted: #9b94b3;
    --green: #5fe3a1;
    --red: #ff6b81;
    --yellow: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1530 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  h1 {
    font-size: 28px; margin: 0;
    background: linear-gradient(90deg, var(--purple-glow), #6f9bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 0.5px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .badge {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; background: rgba(255,255,255,0.02);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at top right, rgba(155,109,255,0.12), transparent 60%);
  }
  .stat-label { font-size: 13px; color: var(--muted); position: relative; }
  .stat-value { font-size: 30px; font-weight: 700; margin-top: 6px; position: relative; }
  .stat-value.purple { color: var(--purple-glow); }
  .stat-value.green { color: var(--green); }
  .stat-value.yellow { color: var(--yellow); }

  h2 { font-size: 18px; margin: 0 0 14px; color: var(--text); }
  .runs { display: flex; flex-direction: column; gap: 12px; }
  .run-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px;
  }
  .run-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .run-topic { font-weight: 600; font-size: 15px; max-width: 620px; }
  .run-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status-pill {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; margin-top: 8px; letter-spacing: 0.3px;
  }
  .status-ok { background: rgba(95,227,161,0.15); color: var(--green); }
  .status-error { background: rgba(255,107,129,0.15); color: var(--red); }
  .links { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .links a {
    font-size: 12px; color: var(--purple-glow); text-decoration: none;
    border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px;
    transition: background 0.15s;
  }
  .links a:hover { background: rgba(155,109,255,0.1); }
  .sound-tag {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    border-top: 1px dashed var(--border); padding-top: 10px;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    border: 1px dashed var(--border); border-radius: 14px;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 50px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🧠 Codex Mental — Painel</h1>
        <div class="subtitle">Acompanhamento do pipeline de conteúdo automatizado</div>
      </div>
      <div class="badge" id="updated">carregando...</div>
    </header>

    <div class="grid" id="stats"></div>

    <h2>Execuções recentes</h2>
    <div class="runs" id="runs"><div class="empty">Carregando dados…</div></div>

    <footer>Codex Mental · dados atualizados automaticamente a cada execução do pipeline</footer>
  </div>

<script>
  const DATA_URL = "./data.json";

  function fmtDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  }

  function fmtCurrency(value, currency) {
    return new Intl.NumberFormat("pt-BR", { style: "currency", currency: currency || "BRL" }).format(value);
  }

  function renderStats(data) {
    const runs = data.runs || [];
    const ok = runs.filter(r => r.status === "ok");
    const totalVideos = ok.reduce((acc, r) => acc + (r.publish?.length || 0), 0);
    const perVideo = data.settings?.estimatedRevenuePerVideo ?? 0;
    const currency = data.settings?.currency ?? "BRL";
    const estimatedRevenue = totalVideos * perVideo;

    const stats = [
      { label: "Execuções totais", value: runs.length, cls: "" },
      { label: "Concluídas com sucesso", value: ok.length, cls: "green" },
      { label: "Vídeos publicados", value: totalVideos, cls: "purple" },
      { label: "Receita estimada (Hotmart)", value: fmtCurrency(estimatedRevenue, currency), cls: "yellow" },
    ];

    document.getElementById("stats").innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="stat-label">${s.label}</div>
        <div class="stat-value ${s.cls}">${s.value}</div>
      </div>
    `).join("");
  }

  function renderRuns(data) {
    const el = document.getElementById("runs");
    const runs = [...(data.runs || [])].reverse();

    if (runs.length === 0) {
      el.innerHTML = `<div class="empty">Nenhuma execução registrada ainda. Rode o pipeline para ver os dados aqui.</div>`;
      return;
    }

    el.innerHTML = runs.map(r => {
      const isOk = r.status === "ok";
      const links = (r.publish || []).map(p =>
        `<a href="${p.url}" target="_blank" rel="noopener">${p.platform === "youtube" ? "▶️ YouTube" : "🎵 TikTok"}</a>`
      ).join("");

      const sound = r.sound
        ? `<div class="sound-tag">🎵 Sugestão de som do dia: <strong>${r.sound.sound}</strong> (${r.sound.category})</div>`
        : "";

      return `
        <div class="run-card">
          <div class="run-top">
            <div>
              <div class="run-topic">${r.topic || "(sem tema registrado)"}</div>
              <span class="status-pill ${isOk ? "status-ok" : "status-error"}">
                ${isOk ? "✅ concluído" : "❌ falhou"}
              </span>
            </div>
            <div class="run-date">${fmtDate(r.completedAt || r.startedAt)}</div>
          </div>
          ${links ? `<div class="links">${links}</div>` : ""}
          ${!isOk && r.error ? `<div class="sound-tag" style="color: var(--red)">⚠️ ${r.error}</div>` : ""}
          ${sound}
        </div>
      `;
    }).join("");
  }

  fetch(DATA_URL, { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      document.getElementById("updated").textContent =
        data.lastUpdated ? `atualizado em ${fmtDate(data.lastUpdated)}` : "sem dados ainda";
      renderStats(data);
      renderRuns(data);
    })
    .catch(err => {
      document.getElementById("runs").innerHTML =
        `<div class="empty">Não foi possível carregar os dados (${err.message}).</div>`;
    });
</script>
</body>
</html>
